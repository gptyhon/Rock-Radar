<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKTV - 角色榜单</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Orbitron:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap");
        :root {
            --bg-a: #0a111f;
            --bg-b: #111a2f;
            --panel: rgba(16, 24, 44, 0.82);
            --panel-border: rgba(145, 171, 235, 0.22);
            --text: #ebf2ff;
            --muted: #97a8cc;
            --gold: #ffcc58;
            --blue: #56a6ff;
            --green: #78f5ce;
            --danger: #ff7689;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            color: var(--text);
            font-family: "Noto Sans SC", "HarmonyOS Sans SC", sans-serif;
            background:
                radial-gradient(1200px 700px at 10% -10%, #284a8f33, transparent 50%),
                radial-gradient(1000px 600px at 100% 120%, #1b5fa044, transparent 50%),
                linear-gradient(145deg, var(--bg-a), var(--bg-b));
        }
        .shell {
            width: min(1520px, 95vw);
            margin: 22px auto;
            display: grid;
            gap: 16px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            background: var(--panel);
            backdrop-filter: blur(8px);
        }
        .title h1 {
            font-family: "Orbitron", sans-serif;
            letter-spacing: 2px;
            font-size: 1.45rem;
            color: #f5fbff;
            text-shadow: 0 0 15px #4f9bff55;
        }
        .title p {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.85rem;
        }
        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            border: 1px solid #6f8bcf66;
            background: #1a2a4a;
            color: #dbe7ff;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .btn:hover { filter: brightness(1.08); }
        .btn.primary {
            border-color: #7db0ff88;
            background: linear-gradient(135deg, #2c4f91, #2f78d0);
            color: #fff;
        }
        .toolbar {
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            background: var(--panel);
            padding: 14px;
        }
        .toolbar-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(150px, 1fr));
            gap: 10px;
            align-items: end;
        }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { color: var(--muted); font-size: 0.78rem; }
        .field input, .field textarea {
            background: #0f1a32;
            color: #e6f0ff;
            border: 1px solid #3a507f;
            border-radius: 9px;
            padding: 8px 10px;
            font-size: 0.88rem;
        }
        .field textarea {
            min-height: 72px;
            resize: vertical;
            grid-column: 1 / -1;
        }
        .toolbar-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .status {
            color: var(--muted);
            font-size: 0.82rem;
        }
        .layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 16px;
        }
        .card {
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            background: var(--panel);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }
        .card-head {
            padding: 12px 14px;
            border-bottom: 1px solid #5f77ad33;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-head h3 {
            font-size: 0.95rem;
            letter-spacing: 1px;
            color: #f3f8ff;
        }
        .card-head .hint { color: var(--muted); font-size: 0.78rem; }
        .table-wrap { overflow: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 740px;
        }
        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #152341;
            color: #b5c6ea;
            font-size: 0.76rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-bottom: 1px solid #5d77ad3a;
            padding: 10px 8px;
        }
        tbody td {
            border-bottom: 1px solid #556b9724;
            padding: 10px 8px;
            font-size: 0.9rem;
            text-align: center;
        }
        tbody tr { cursor: pointer; transition: background 0.16s ease; }
        tbody tr:hover { background: #2b3f6828; }
        tbody tr.active { background: #37548f4a; }
        .rank {
            font-family: "Orbitron", sans-serif;
            color: var(--gold);
            font-size: 0.95rem;
        }
        .name-cell {
            text-align: left;
            font-weight: 700;
            color: #eaf2ff;
        }
        .rating {
            font-family: "Orbitron", sans-serif;
            color: var(--green);
        }
        .score { color: #cfe1ff; }
        .detail {
            padding: 14px;
            display: grid;
            gap: 12px;
        }
        .player-name {
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-size: 2.2rem;
            color: var(--gold);
            line-height: 1;
            text-shadow: 0 0 18px #ffca5638;
        }
        .chips { display: flex; flex-wrap: wrap; gap: 7px; }
        .chip {
            font-size: 0.78rem;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid #6c85b854;
            color: #d8e6ff;
            background: #172643;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }
        .metric {
            border: 1px solid #607bac4a;
            background: #13213d;
            border-radius: 10px;
            padding: 8px;
        }
        .metric .label { color: #9eb2db; font-size: 0.76rem; }
        .metric .value { margin-top: 4px; color: #f0f6ff; font-size: 1.05rem; font-weight: 700; }
        .comment {
            border: 1px solid #607bac4a;
            border-radius: 10px;
            background: #13213d;
            padding: 11px;
        }
        .comment h4 { font-size: 0.82rem; color: #9fb5e0; margin-bottom: 6px; }
        .comment p { color: #e7efff; line-height: 1.65; font-size: 0.92rem; }
        .danger { color: var(--danger); }
        @media (max-width: 1080px) {
            .toolbar-grid { grid-template-columns: 1fr 1fr; }
            .layout { grid-template-columns: 1fr; }
            .field textarea { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="title">
            <h1 id="pageTitle">HKTV - 角色榜单</h1>
            <p id="metaLine">加载中...</p>
        </div>
        <div class="top-actions">
            <a class="btn" href="/">管理面板</a>
            <a class="btn" href="/radar" target="_blank">雷达展示</a>
            <button class="btn" id="btnRefresh">刷新数据</button>
        </div>
    </header>

    <section class="toolbar">
        <div class="toolbar-grid">
            <div class="field">
                <label>主题</label>
                <input id="topicInput" value="货币战争">
            </div>
            <div class="field">
                <label>模型</label>
                <input id="modelInput" value="gpt-5.4">
            </div>
            <div class="field">
                <label>Base URL（可选）</label>
                <input id="baseUrlInput" placeholder="例: https://api.openai.com/v1">
            </div>
            <div class="field">
                <label>最少角色数</label>
                <input id="countInput" type="number" min="4" value="16">
            </div>
            <div class="field">
                <label>温度</label>
                <input id="tempInput" type="number" min="0" max="1.5" step="0.1" value="0.6">
            </div>
            <div class="field">
                <label>六个维度（逗号分隔）</label>
                <input id="dimsInput" value="运营,交易,资源,控场,成长,稳定">
            </div>
            <div class="field">
                <label>角色名单（可选，一行一个；填写后将严格按名单生成）</label>
                <textarea id="namesInput" placeholder="留空=让 LLM 自动枚举角色"></textarea>
            </div>
        </div>
        <div class="toolbar-actions">
            <button class="btn primary" id="btnGenerate">LLM 生成并覆盖榜单</button>
            <span class="status" id="statusText">就绪</span>
        </div>
    </section>

    <main class="layout">
        <section class="card">
            <div class="card-head">
                <h3>RANKING</h3>
                <span class="hint" id="tableHint">0 players</span>
            </div>
            <div class="table-wrap">
                <table id="leaderboardTable">
                    <thead><tr id="tableHeadRow"></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>

        <aside class="card">
            <div class="card-head">
                <h3>PLAYER DETAIL</h3>
                <span class="hint">HLTV 风格短评</span>
            </div>
            <div class="detail" id="detailPanel">
                <div class="danger">请选择左侧角色查看详情</div>
            </div>
        </aside>
    </main>
</div>

<script>
    let state = null;
    let selectedIndex = 0;

    function setStatus(text, isError = false) {
        const el = document.getElementById('statusText');
        el.textContent = text;
        el.style.color = isError ? '#ff8ca0' : '#9ab0d8';
    }

    function formatTime(iso) {
        if (!iso) return '未知时间';
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return `${y}-${m}-${day} ${hh}:${mm}`;
    }

    function parseDims() {
        const parts = document.getElementById('dimsInput').value
            .split(',')
            .map(v => v.trim())
            .filter(Boolean);
        if (parts.length !== 6) throw new Error('维度必须刚好 6 个');
        return parts;
    }

    function parseNames() {
        return document.getElementById('namesInput').value
            .split('\n')
            .map(v => v.trim())
            .filter(Boolean);
    }

    function renderHead() {
        const row = document.getElementById('tableHeadRow');
        const dims = state?.meta?.dimensions || [];
        const head = ['#', '角色', 'Rating', ...dims];
        row.innerHTML = head.map(v => `<th>${v}</th>`).join('');
    }

    function renderTable() {
        renderHead();
        const players = Array.isArray(state?.players) ? state.players : [];
        document.getElementById('tableHint').textContent = `${players.length} players`;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = players.map((p, idx) => {
            const scoreCells = p.scores.map(s => `<td class="score">${Number(s).toFixed(1)}</td>`).join('');
            return `
                <tr data-idx="${idx}" class="${idx === selectedIndex ? 'active' : ''}">
                    <td class="rank">${idx + 1}</td>
                    <td class="name-cell">${p.name}</td>
                    <td class="rating">${Number(p.rating).toFixed(2)}</td>
                    ${scoreCells}
                </tr>
            `;
        }).join('');
        tbody.querySelectorAll('tr').forEach(tr => {
            tr.addEventListener('click', () => {
                selectedIndex = Number(tr.dataset.idx || 0);
                renderTable();
                renderDetail();
            });
        });
    }

    function metricHtml(label, value) {
        return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    }

    function renderDetail() {
        const panel = document.getElementById('detailPanel');
        const player = state?.players?.[selectedIndex];
        if (!player) {
            panel.innerHTML = '<div class="danger">暂无数据</div>';
            return;
        }
        const dims = state.meta.dimensions || [];
        const metrics = dims.map((d, i) => metricHtml(d, Number(player.scores[i] || 0).toFixed(1))).join('');
        const tags = Array.isArray(player.tags) ? player.tags : [];
        panel.innerHTML = `
            <div class="player-name">${player.name}</div>
            <div class="chips">${tags.map(t => `<span class="chip">${t}</span>`).join('')}</div>
            <div class="metrics">
                ${metricHtml('Rating', Number(player.rating).toFixed(2))}
                ${metricHtml('均分', (player.scores.reduce((a, b) => a + Number(b || 0), 0) / 6).toFixed(1))}
                ${metrics}
            </div>
            <div class="comment"><h4>Headline</h4><p>${player.comments?.headline || ''}</p></div>
            <div class="comment"><h4>Summary</h4><p>${player.comments?.summary || ''}</p></div>
            <div class="comment"><h4>Playstyle</h4><p>${player.comments?.style || ''}</p></div>
        `;
    }

    function renderMeta() {
        const meta = state?.meta || {};
        document.getElementById('pageTitle').textContent = meta.title || 'HKTV - 角色榜单';
        document.getElementById('topicInput').value = meta.topic || '货币战争';
        document.getElementById('dimsInput').value = (meta.dimensions || []).join(',');
        document.getElementById('metaLine').textContent = `主题：${meta.topic || '-'} | 更新：${formatTime(meta.updatedAt)} | 来源：${meta.generatedBy || 'unknown'}`;
    }

    async function loadData() {
        setStatus('正在加载数据...');
        const res = await fetch('/api/hktv-data');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '加载失败');
        state = data;
        selectedIndex = Math.min(selectedIndex, Math.max(0, (state.players?.length || 1) - 1));
        renderMeta();
        renderTable();
        renderDetail();
        setStatus('数据已加载');
    }

    async function generateByLLM() {
        let dims;
        try {
            dims = parseDims();
        } catch (e) {
            setStatus(e.message, true);
            return;
        }
        const baseUrl = document.getElementById('baseUrlInput').value.trim();
        if (baseUrl) localStorage.setItem('hktv_base_url', baseUrl);
        else localStorage.removeItem('hktv_base_url');
        const payload = {
            topic: document.getElementById('topicInput').value.trim() || '货币战争',
            model: document.getElementById('modelInput').value.trim() || 'gpt-5.4',
            baseUrl: baseUrl || undefined,
            minCount: Number(document.getElementById('countInput').value || 16),
            temperature: Number(document.getElementById('tempInput').value || 0.6),
            dimensions: dims,
            characterNames: parseNames()
        };
        setStatus('正在调用 LLM 生成，可能需要 10-40 秒...');
        const res = await fetch('/api/hktv-generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || '生成失败');
        state = data.data;
        selectedIndex = 0;
        renderMeta();
        renderTable();
        renderDetail();
        setStatus('LLM 生成完成并已保存到 hktv-data.json');
    }

    document.getElementById('btnRefresh').addEventListener('click', () => {
        loadData().catch(err => setStatus(err.message, true));
    });
    document.getElementById('btnGenerate').addEventListener('click', () => {
        generateByLLM().catch(err => setStatus(err.message, true));
    });

    document.getElementById('baseUrlInput').value = localStorage.getItem('hktv_base_url') || '';
    loadData().catch(err => setStatus(err.message, true));
</script>
</body>
</html>
