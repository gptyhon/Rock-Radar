<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rock Radar - 战力雷达图</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Serif+SC:wght@700;900&family=Orbitron:wght@500;700;900&family=ZCOOL+QingKe+HuangYou&family=ZCOOL+XiaoWei&display=swap");
        /* 引入鸿蒙字体 (使用更稳定的全局地址) */
        @import url("https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/harmonyos-sans/1.1.0/style.css");

        :root {
            --theme-color: #00ffff;
            --bg-color-1: #0f1015;
            --bg-color-2: #1a1a2e;
            --radar-shift-y: 0px;
            --brand-gold: #d4ab59;
            --brand-gold-bright: #f8e6b7;
            --brand-gold-deep: #6f4713;

            /* Portrait layout variables */
            --portrait-width: 100vw;
            --portrait-height: 100vh;
            --top-section-height: 15vh;
            --middle-section-height: 35vh;
            --bottom-section-height: 50vh;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: "HarmonyOS Sans SC", "PingFang SC", "Lantinghei SC", "Microsoft YaHei", "HanHei SC", "Helvetica Neue", "Open Sans", Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(180deg, var(--bg-color-1), var(--bg-color-2), #050508, #111);
            background-size: 100% 400%;
            animation: gradientBGPortrait 30s ease infinite;
            color: #fff;
            transition: all 2s ease;
        }

        @keyframes gradientBGPortrait {
            0% { background-position: 0% 0%; }
            50% { background-position: 0% 100%; }
            100% { background-position: 0% 0%; }
        }

        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1005; /* 初始置顶以显示粒子 */
            pointer-events: none;
        }

        #coverBgLayer {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
            background:
                radial-gradient(circle at 50% 15%, rgba(212, 171, 89, 0.18) 0%, rgba(212, 171, 89, 0) 35%),
                radial-gradient(circle at 50% 50%, rgba(99, 230, 255, 0.12) 0%, rgba(99, 230, 255, 0) 40%),
                radial-gradient(circle at 18% 22%, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 18%),
                linear-gradient(180deg, var(--bg-color-1), var(--bg-color-2), #050508, #111);
            background-size: 140% 140%, 100% 100%, 120% 120%, 100% 400%;
            animation: gradientBGPortrait 16s ease infinite;
            box-shadow: inset 0 0 160px rgba(0,0,0,0.46), inset 0 0 90px rgba(212, 171, 89, 0.08);
        }

        #coverBgLayer::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle, rgba(246,251,255,0.66) 0 1px, rgba(246,251,255,0) 1.8px),
                radial-gradient(circle, rgba(99,230,255,0.34) 0 1.2px, rgba(99,230,255,0) 2.2px),
                linear-gradient(90deg, rgba(99,230,255,0.03) 1px, transparent 1px),
                linear-gradient(rgba(99,230,255,0.025) 1px, transparent 1px);
            background-size: 72px 72px, 118px 118px, 96px 96px, 96px 96px;
            background-position: 0 0, 34px 18px, 0 0, 0 0;
            opacity: 0.72;
            animation: introParticleDrift 9s linear infinite;
        }

        #radarBgCleaner {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.28s ease;
            background: linear-gradient(180deg, var(--bg-color-1), var(--bg-color-2), #050508, #111);
            background-size: 100% 400%;
            animation: gradientBGPortrait 30s ease infinite;
            will-change: clip-path, opacity;
        }

        #brandTextLayer {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0.94;
        }

        .bg-brand-watermark {
            position: absolute;
            left: 4vw;
            top: 52%;
            transform: translateY(-50%) rotate(-13deg);
            opacity: 0.2;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 18px rgba(255, 224, 146, 0.12));
            animation: brandWatermarkFloat 16s ease-in-out infinite alternate;
        }

        .bg-brand-watermark-cn,
        .bg-brand-watermark-en {
            display: block;
        }

        .bg-brand-watermark-cn {
            font-family: "Cormorant Garamond", "Noto Serif SC", "Times New Roman", serif;
            font-size: clamp(78px, 8.4vw, 168px);
            font-weight: 900;
            line-height: 0.94;
            letter-spacing: 0.22em;
            padding-left: 0.22em;
            color: transparent;
            background: linear-gradient(180deg, rgba(255,255,255,0.58) 0%, rgba(255,242,206,0.54) 16%, rgba(244,214,145,0.38) 48%, rgba(153,98,28,0.16) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-stroke: 1px rgba(255, 232, 176, 0.18);
            text-shadow:
                0 0 6px rgba(255, 242, 206, 0.16),
                0 0 22px rgba(212, 171, 89, 0.08);
        }

        .bg-brand-watermark-en {
            margin-top: 10px;
            margin-left: 22px;
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(12px, 1vw, 20px);
            font-weight: 700;
            letter-spacing: 0.62em;
            color: rgba(255, 232, 176, 0.4);
            text-shadow: 0 0 10px rgba(255, 214, 126, 0.12);
        }

        .bg-brand-serial {
            position: absolute;
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.34em;
            color: rgba(255, 230, 170, 0.42);
            text-shadow: 0 0 10px rgba(255, 219, 140, 0.08);
            white-space: nowrap;
        }

        .bg-brand-serial-top {
            top: 54px;
            right: 58px;
        }

        .bg-brand-serial-bottom {
            bottom: 58px;
            left: 44px;
        }

        body.cover-bg-active #coverBgLayer {
            opacity: 1;
        }

        body.cover-bg-active #brandDecor {
            opacity: 0.78;
            filter: saturate(1) brightness(1);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #brandDecor {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .brand-security-pattern,
        .brand-sky-curtain,
        .brand-emblem,
        .brand-scan-badge,
        .brand-watermark,
        .brand-corner,
        .brand-diamond,
        .brand-serial {
            position: absolute;
            pointer-events: none;
        }

        .brand-security-pattern {
            inset: -10%;
            opacity: 0.62;
            background:
                radial-gradient(circle at 18% 24%, rgba(255, 232, 176, 0.075) 0 1.5px, rgba(255, 232, 176, 0) 2px),
                radial-gradient(circle at 78% 70%, rgba(255, 214, 126, 0.058) 0 1.5px, rgba(255, 214, 126, 0) 2px),
                repeating-linear-gradient(118deg, rgba(255, 223, 148, 0.03) 0 2px, rgba(255, 223, 148, 0) 2px 24px),
                repeating-radial-gradient(circle at 50% 50%, rgba(255, 220, 136, 0.026) 0 1px, rgba(255, 220, 136, 0) 1px 26px),
                linear-gradient(90deg, rgba(255, 219, 140, 0.02), rgba(255, 219, 140, 0) 16%, rgba(255, 219, 140, 0) 84%, rgba(255, 219, 140, 0.02));
            -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.12), #000 26%, #000 72%, rgba(0, 0, 0, 0.18));
            mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.12), #000 26%, #000 72%, rgba(0, 0, 0, 0.18));
            animation: brandSecurityDrift 42s linear infinite;
        }

        .brand-sky-curtain {
            display: none !important;
        }

        .brand-emblem {
            left: -2vw;
            top: 50%;
            width: min(56vw, 940px);
            height: min(34vw, 520px);
            transform: translateY(-50%) rotate(-11deg) skewX(-12deg);
            border-radius: 36px;
            opacity: 0.22;
            background:
                linear-gradient(90deg, rgba(255, 232, 176, 0.12), rgba(255, 232, 176, 0) 18%, rgba(255, 232, 176, 0) 82%, rgba(255, 232, 176, 0.08)),
                repeating-linear-gradient(90deg, rgba(255, 221, 150, 0.08) 0 1px, rgba(255, 221, 150, 0) 1px 34px),
                repeating-linear-gradient(0deg, rgba(255, 221, 150, 0.06) 0 1px, rgba(255, 221, 150, 0) 1px 26px),
                linear-gradient(135deg, rgba(255, 245, 214, 0.08), rgba(255, 214, 126, 0.04) 42%, rgba(255, 214, 126, 0.01) 76%);
            border: 1px solid rgba(255, 232, 176, 0.16);
            box-shadow:
                inset 0 0 0 1px rgba(255, 244, 214, 0.06),
                inset 0 0 34px rgba(255, 214, 126, 0.03),
                0 0 22px rgba(255, 219, 134, 0.06);
            -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0) 0%, #000 10%, #000 74%, rgba(0, 0, 0, 0) 100%);
            mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0) 0%, #000 10%, #000 74%, rgba(0, 0, 0, 0) 100%);
            filter: blur(0.2px);
            animation: brandEmblemFloat 18s ease-in-out infinite alternate;
        }

        .brand-emblem::before,
        .brand-emblem::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
        }

        .brand-emblem::before {
            inset: 7% 9%;
            border: 1px solid rgba(255, 232, 176, 0.14);
            background:
                linear-gradient(90deg, rgba(255, 232, 176, 0.12), rgba(255, 232, 176, 0) 22%, rgba(255, 232, 176, 0) 78%, rgba(255, 232, 176, 0.08)),
                linear-gradient(0deg, rgba(255, 232, 176, 0.06), rgba(255, 232, 176, 0));
        }

        .brand-emblem::after {
            inset: 16% 12%;
            background:
                linear-gradient(90deg, rgba(255, 232, 176, 0) 0%, rgba(255, 232, 176, 0.12) 18%, rgba(255, 232, 176, 0.12) 82%, rgba(255, 232, 176, 0) 100%) center / 100% 1px no-repeat,
                linear-gradient(0deg, rgba(255, 232, 176, 0) 0%, rgba(255, 232, 176, 0.08) 18%, rgba(255, 232, 176, 0.08) 82%, rgba(255, 232, 176, 0) 100%) center / 1px 100% no-repeat,
                linear-gradient(118deg, rgba(255, 232, 176, 0) 34%, rgba(255, 232, 176, 0.1) 50%, rgba(255, 232, 176, 0) 66%),
                linear-gradient(90deg, rgba(255, 232, 176, 0.06) 0 16%, rgba(255, 232, 176, 0) 16% 84%, rgba(255, 232, 176, 0.04) 84% 100%);
        }

        .brand-watermark {
            left: 4vw;
            top: 52%;
            transform: translateY(-50%) rotate(-13deg);
            opacity: 0.15;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 18px rgba(255, 224, 146, 0.12));
            animation: brandWatermarkFloat 16s ease-in-out infinite alternate;
        }

        .brand-watermark-cn,
        .brand-watermark-en {
            display: block;
        }

        .brand-watermark-cn {
            font-family: "Cormorant Garamond", "Noto Serif SC", "Times New Roman", serif;
            font-size: clamp(78px, 8.4vw, 168px);
            font-weight: 900;
            line-height: 0.94;
            letter-spacing: 0.22em;
            padding-left: 0.22em;
            color: transparent;
            background: linear-gradient(180deg, rgba(255,255,255,0.58) 0%, rgba(255,242,206,0.54) 16%, rgba(244,214,145,0.38) 48%, rgba(153,98,28,0.16) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-stroke: 1px rgba(255, 232, 176, 0.18);
            text-shadow:
                0 0 6px rgba(255, 242, 206, 0.16),
                0 0 22px rgba(212, 171, 89, 0.08);
        }

        .brand-watermark-en {
            margin-top: 10px;
            margin-left: 22px;
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(12px, 1vw, 20px);
            font-weight: 700;
            letter-spacing: 0.62em;
            color: rgba(255, 232, 176, 0.4);
            text-shadow: 0 0 10px rgba(255, 214, 126, 0.12);
        }

        .brand-corner {
            width: 280px;
            height: 200px;
            opacity: 0.62;
            filter: drop-shadow(0 0 10px rgba(255, 221, 146, 0.08));
        }

        .brand-corner::before,
        .brand-corner::after {
            content: '';
            position: absolute;
            inset: 0;
        }

        .brand-corner::before {
            background:
                linear-gradient(90deg, rgba(255, 232, 176, 0.48), rgba(255, 232, 176, 0)) top left / 100% 1px no-repeat,
                linear-gradient(180deg, rgba(255, 232, 176, 0.48), rgba(255, 232, 176, 0)) top left / 1px 100% no-repeat,
                linear-gradient(90deg, rgba(255, 232, 176, 0.28), rgba(255, 232, 176, 0)) top 18px left 0 / 118px 1px no-repeat,
                linear-gradient(180deg, rgba(255, 232, 176, 0.28), rgba(255, 232, 176, 0)) top left 18px / 1px 108px no-repeat;
        }

        .brand-corner::after {
            background:
                linear-gradient(135deg, rgba(255, 232, 176, 0.22), rgba(255, 232, 176, 0) 62%) top left / 138px 138px no-repeat,
                radial-gradient(circle at 26px 26px, rgba(255, 232, 176, 0.24) 0 2px, rgba(255, 232, 176, 0) 4px),
                linear-gradient(90deg, rgba(255, 232, 176, 0.18), rgba(255, 232, 176, 0)) top 44px left 18px / 164px 1px no-repeat;
        }

        .brand-corner-top-right {
            top: 28px;
            right: 30px;
            transform: scaleX(-1);
        }

        .brand-corner-bottom-left {
            bottom: 36px;
            left: 26px;
            transform: scaleY(-1);
        }

        .brand-serial {
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.34em;
            color: rgba(255, 230, 170, 0.34);
            text-shadow: 0 0 10px rgba(255, 219, 140, 0.08);
            white-space: nowrap;
        }

        .brand-serial-top {
            top: 54px;
            right: 58px;
        }

        .brand-serial-bottom {
            bottom: 58px;
            left: 44px;
        }

        .brand-scan-badge {
            top: 28px;
            left: 34px;
            width: clamp(162px, 11.6vw, 208px);
            height: clamp(112px, 8.2vw, 146px);
            z-index: 1;
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid rgba(130, 224, 255, 0.16);
            background:
                linear-gradient(180deg, rgba(7, 17, 28, 0.46), rgba(5, 10, 18, 0.14)),
                radial-gradient(circle at 18% 20%, rgba(99, 230, 255, 0.14), rgba(99, 230, 255, 0) 44%),
                linear-gradient(120deg, rgba(112, 198, 255, 0.05), rgba(255, 255, 255, 0) 48%, rgba(99, 230, 255, 0.04));
            box-shadow:
                inset 0 0 0 1px rgba(230, 250, 255, 0.04),
                inset 0 0 26px rgba(90, 205, 255, 0.05),
                0 0 28px rgba(99, 230, 255, 0.08);
            backdrop-filter: blur(4px);
            contain: layout paint;
            display: none !important;
        }

        .brand-scan-badge::before,
        .brand-scan-badge::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .brand-scan-badge::before {
            background:
                linear-gradient(90deg, rgba(99, 230, 255, 0.18), rgba(99, 230, 255, 0)) top 14px left 16px / 88px 1px no-repeat,
                linear-gradient(180deg, rgba(99, 230, 255, 0.18), rgba(99, 230, 255, 0)) top 14px left 16px / 1px 54px no-repeat,
                linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0)) bottom 14px right 18px / 74px 1px no-repeat,
                linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0)) bottom 14px right 18px / 1px 42px no-repeat;
            opacity: 0.9;
        }

        .brand-scan-badge::after {
            inset: 10px;
            border-radius: 16px;
            border: 1px solid rgba(130, 224, 255, 0.06);
        }

        .brand-scan-grid {
            position: absolute;
            inset: 10px;
            border-radius: 16px;
            opacity: 0.38;
            background:
                repeating-linear-gradient(90deg, rgba(110, 214, 255, 0.08) 0 1px, rgba(110, 214, 255, 0) 1px 22px),
                repeating-linear-gradient(0deg, rgba(110, 214, 255, 0.06) 0 1px, rgba(110, 214, 255, 0) 1px 20px),
                linear-gradient(125deg, rgba(99, 230, 255, 0.08), rgba(99, 230, 255, 0) 52%);
            animation: brandScanGridShift 12s linear infinite;
        }

        .brand-scan-ring {
            position: absolute;
            left: 16px;
            top: 17px;
            width: clamp(66px, 4.8vw, 86px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 1px solid rgba(132, 230, 255, 0.22);
            box-shadow:
                inset 0 0 18px rgba(88, 208, 255, 0.08),
                0 0 18px rgba(99, 230, 255, 0.08);
            background:
                radial-gradient(circle at center, rgba(212, 249, 255, 0.16) 0 7%, rgba(99, 230, 255, 0.08) 7% 28%, rgba(99, 230, 255, 0) 28%),
                radial-gradient(circle at center, rgba(99, 230, 255, 0.16) 0 1px, rgba(99, 230, 255, 0) 2px),
                conic-gradient(from 0deg, rgba(99, 230, 255, 0.22), rgba(99, 230, 255, 0.04) 28%, rgba(99, 230, 255, 0) 52%, rgba(255, 255, 255, 0.16) 78%, rgba(99, 230, 255, 0.22));
            animation: brandScanPulse 4.8s ease-in-out infinite;
        }

        .brand-scan-ring::before,
        .brand-scan-ring::after {
            content: '';
            position: absolute;
            inset: 12%;
            border-radius: 50%;
            border: 1px solid rgba(225, 249, 255, 0.1);
        }

        .brand-scan-ring::after {
            inset: 28%;
            border-color: rgba(99, 230, 255, 0.18);
        }

        .brand-scan-sweep {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 46%;
            height: 1px;
            transform-origin: 0 50%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), rgba(99, 230, 255, 0.36), rgba(99, 230, 255, 0));
            box-shadow:
                0 0 12px rgba(255, 255, 255, 0.16),
                0 0 18px rgba(99, 230, 255, 0.16);
            animation: brandScanSweep 3.6s linear infinite;
        }

        .brand-scan-node {
            position: absolute;
            width: 5px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: rgba(232, 251, 255, 0.9);
            box-shadow: 0 0 10px rgba(99, 230, 255, 0.24);
            animation: brandScanBlink 2.8s ease-in-out infinite;
        }

        .brand-scan-node-a { top: 14%; left: 68%; animation-delay: -0.4s; }
        .brand-scan-node-b { top: 68%; left: 24%; animation-delay: -1.2s; }
        .brand-scan-node-c { top: 62%; left: 76%; animation-delay: -2s; }

        .brand-scan-meta {
            position: absolute;
            right: 14px;
            top: 16px;
            width: calc(100% - 112px);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .brand-scan-chip {
            padding: 4px 8px 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(153, 235, 255, 0.18);
            background: linear-gradient(90deg, rgba(77, 186, 255, 0.16), rgba(77, 186, 255, 0.04));
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.24em;
            color: rgba(229, 250, 255, 0.92);
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(99, 230, 255, 0.14);
        }

        .brand-scan-value {
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(18px, 1.5vw, 26px);
            font-weight: 900;
            letter-spacing: 0.16em;
            color: rgba(244, 252, 255, 0.94);
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.08),
                0 0 18px rgba(99, 230, 255, 0.16);
        }

        .brand-scan-track {
            position: relative;
            width: 100%;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04), rgba(99, 230, 255, 0.08));
            box-shadow: inset 0 0 0 1px rgba(122, 222, 255, 0.08);
        }

        .brand-scan-track span {
            position: absolute;
            inset: 1px;
            width: 58%;
            border-radius: inherit;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.76), rgba(99, 230, 255, 0.52) 34%, rgba(99, 230, 255, 0.08));
            box-shadow:
                0 0 12px rgba(99, 230, 255, 0.16),
                inset 0 0 6px rgba(255, 255, 255, 0.2);
            animation: brandScanTrackMove 4.8s cubic-bezier(0.42, 0, 0.22, 1) infinite;
        }

        .brand-scan-track span::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: translateY(-50%);
            background: rgba(246, 252, 255, 0.94);
            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.18),
                0 0 14px rgba(99, 230, 255, 0.22);
        }

        .brand-scan-stats {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: rgba(198, 241, 255, 0.52);
        }

        .brand-scan-stats span {
            position: relative;
            padding-left: 10px;
        }

        .brand-scan-stats span::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            transform: translateY(-50%);
            background: rgba(227, 249, 255, 0.86);
            box-shadow: 0 0 10px rgba(99, 230, 255, 0.2);
        }

        @keyframes brandScanGridShift {
            0% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(-10px, 6px, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        @keyframes brandScanPulse {
            0%, 100% { transform: scale(1); opacity: 0.88; }

        /* Portrait Layout Structure */
        .main-layout {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Top Section: Event Info & Score */
        .top-section {
            height: var(--top-section-height);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5vh 4vw;
            position: relative;
            z-index: 100;
        }

        .event-title {
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 700;
            letter-spacing: 0.18em;
            color: var(--brand-gold-bright);
            text-shadow: 0 0 12px rgba(212, 171, 89, 0.4);
            margin-bottom: 0.5vh;
        }

        .overall-score {
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(28px, 7vw, 48px);
            font-weight: 900;
            letter-spacing: 0.08em;
            color: var(--brand-gold);
            text-shadow: 0 0 18px rgba(212, 171, 89, 0.6);
        }

        /* Middle Section: Radar Chart */
        .middle-section {
            height: var(--middle-section-height);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: visible;
            z-index: 50;
        }

        .left-panel {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: visible;
        }

        #radarCanvas {
            width: min(90vw, calc(var(--middle-section-height) * 0.9));
            height: min(90vw, calc(var(--middle-section-height) * 0.9));
            aspect-ratio: 1/1;
            transform: translateY(0) scale(1.2);
            opacity: 1;
            filter: blur(0);
            transition: opacity 0.28s ease, transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
        }

        #radarCanvas.radar-hidden {
            opacity: 0;
            filter: blur(18px);
            transform: translateY(0) scale(1.4);
        }

        #radarCanvas.radar-reveal {
            animation: radarEntrancePortrait 0.78s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes radarEntrancePortrait {
            0% { opacity: 0; filter: blur(24px); transform: translateY(0) scale(1.5); }
            60% { opacity: 1; filter: blur(3px); transform: translateY(0) scale(1.28); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0) scale(1.2); }
        }

        /* Bottom Section: Character Display */
        .bottom-section {
            height: var(--bottom-section-height);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            z-index: 10;
        }

        .character-image-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
        }

        .character-image-wrapper::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, var(--bg-color-1), transparent);
            z-index: 1;
            pointer-events: none;
        }

        .band-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center bottom;
            transform: scale(1.1);
            filter: brightness(0.95) saturate(1.1);
        }

        .character-info-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 2.5vh 5vw 3vh 5vw;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 1vh;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
        }

        .character-id-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .band-name {
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(32px, 8vw, 54px);
            font-weight: 900;
            letter-spacing: 0.12em;
            color: #fff;
            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.9),
                0 0 32px var(--theme-color),
                0 0 48px var(--theme-color);
            text-stroke: 1px rgba(0, 0, 0, 0.5);
            -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.3);
        }

        .team-info-section {
            display: flex;
            align-items: center;
            gap: 2vw;
        }

        .team-logo {
            width: clamp(32px, 8vw, 52px);
            height: clamp(32px, 8vw, 52px);
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            object-fit: cover;
        }

        .band-equipment-grid {
            display: flex;
            gap: 1.5vw;
        }

        .equipment-item {
            width: clamp(36px, 9vw, 56px);
            height: clamp(36px, 9vw, 56px);
            border-radius: 8px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            background: rgba(0, 0, 0, 0.3);
            object-fit: cover;
            box-shadow:
                0 0 12px rgba(255, 215, 0, 0.3),
                inset 0 0 8px rgba(255, 255, 255, 0.1);
        }

        .right-panel {
            display: none; /* Hide old right panel in portrait mode */
        }

        .band-info-box {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        body.band-theme-silverwolf .band-info-box {
            position: relative;
        }

        body.band-theme-silverwolf .band-info-box::before {
            content: '';
            position: absolute;
            top: -16px;
            left: -18px;
            width: min(100%, 620px);
            height: calc(100% + 24px);
            pointer-events: none;
            border: 1px solid rgba(116, 132, 255, 0.18);
            border-radius: 18px;
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
            box-shadow:
                0 0 0 1px rgba(16, 12, 44, 0.92) inset,
                0 0 16px rgba(111, 95, 255, 0.12),
                0 0 28px rgba(74, 224, 255, 0.08);
            background:
                linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0) 24%),
                repeating-linear-gradient(90deg, rgba(118, 132, 255, 0.04) 0 2px, rgba(118, 132, 255, 0) 2px 18px);
        }

        .band-name-row {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
        }

        .band-name { 
            font-family: "Orbitron", sans-serif;
            font-size: 3rem; 
            font-weight: 900; 
            color: var(--theme-color); 
            text-shadow: 0 0 15px var(--theme-color);
            min-width: 0;
            transition: all 2s ease; /* 名字颜色和发光慢速切换 */
            animation: nameEntrance 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        body.band-theme-silverwolf .band-name {
            font-family: "Orbitron", "Rajdhani", "HarmonyOS Sans SC", sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #d7dcff;
            text-shadow:
                0 0 0 rgba(0,0,0,0),
                0 0 10px rgba(166, 181, 255, 0.42),
                0 0 24px rgba(125, 98, 255, 0.28),
                4px 4px 0 rgba(22, 14, 58, 0.88),
                8px 8px 0 rgba(10, 10, 30, 0.54);
            filter: drop-shadow(0 0 18px rgba(103, 214, 255, 0.18));
        }

        body.band-theme-silverwolf .band-name::before {
            content: '';
            position: absolute;
            inset: -10px -18px;
            pointer-events: none;
            border: 2px solid rgba(128, 150, 255, 0.38);
            border-radius: 10px;
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            box-shadow:
                0 0 0 1px rgba(32, 22, 82, 0.92) inset,
                0 0 18px rgba(111, 95, 255, 0.18),
                0 0 28px rgba(74, 224, 255, 0.14);
            opacity: 0.94;
        }

        .band-star-rank {
            width: clamp(100px, 24vw, 160px);
            aspect-ratio: 5 / 1;
            object-fit: contain;
            opacity: 0;
            transform: translate3d(0, -28px, 0) scale(0.96);
            filter:
                brightness(1.3)
                saturate(1.3)
                contrast(1.1)
                drop-shadow(0 0 10px rgba(255, 247, 196, 0.5))
                drop-shadow(0 0 20px rgba(255, 200, 88, 0.4));
            transition: opacity 0.46s ease, transform 0.62s cubic-bezier(0.16, 1, 0.3, 1), filter 0.58s ease;
            pointer-events: none;
            flex: 0 0 auto;
        }

        .band-star-rank.show {
            opacity: 0.9;
            transform: translate3d(0, 0, 0) scale(1);
        }

        .band-star-rank.exit {
            opacity: 0;
            transform: translate3d(0, 24px, 0) scale(0.98);
        }

        .bond-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 2vw;
            min-height: 36px;
            align-items: center;
            opacity: 0;
            transform: translate3d(0, 20px, 0);
            filter: blur(10px);
            animation: bondEntrancePortrait 0.88s cubic-bezier(0.18, 0.92, 0.24, 1) 0.18s both;
        }

        @keyframes bondEntrancePortrait {
            0% { opacity: 0; transform: translate3d(0, 20px, 0); filter: blur(10px); }
            100% { opacity: 1; transform: translate3d(0, 0, 0); filter: blur(0); }
        }

        .bond-item {
            height: clamp(32px, 8vw, 42px);
            display: inline-flex;
            align-items: center;
            gap: 1.5vw;
            padding: 4px 2.5vw 4px 1vw;
            border-radius: 10px;
            color: rgba(235,248,255,0.9);
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(220,245,255,0.14);
            box-shadow: 0 0 14px rgba(99,230,255,0.08), inset 0 0 18px rgba(255,255,255,0.04);
        }

        .bond-icon {
            width: clamp(24px, 6vw, 32px);
            height: clamp(24px, 6vw, 32px);
            border-radius: 7px;
            object-fit: cover;
            background: transparent;
            border: none;
            box-shadow: none;
            flex: 0 0 auto;
        }

        .bond-label {
            font: 700 clamp(11px, 2.8vw, 13px) "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        .bond-item.no-icon {
            height: clamp(28px, 7vw, 32px);
            padding: 0 2.5vw;
            border-radius: 8px;
        }

        @keyframes bondEntrance {
            0% { opacity: 0; transform: translate3d(38px, 0, 0); filter: blur(10px); }
            70% { opacity: 1; transform: translate3d(-3px, 0, 0); filter: blur(0); }
            100% { opacity: 1; transform: translate3d(0, 0, 0); filter: blur(0); }
        }

        @keyframes nameEntrance {
            0% { opacity: 0; transform: translate3d(56px, 0, 0) scale(0.92) skewX(-5deg); filter: blur(12px); }
            68% { opacity: 1; transform: translate3d(-6px, 0, 0) scale(1.015) skewX(1deg); filter: blur(0); }
            100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1) skewX(0); filter: blur(0); }
        }

        .band-photo-container {
            width: 100%;
            height: 380px; 
            background: radial-gradient(circle at center, rgba(255,255,255,0.04), rgba(255,255,255,0.01) 56%, rgba(255,255,255,0) 100%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            transition: all 2s ease;
            perspective: 1200px;
            border-radius: 26px;
            position: relative;
        }

        .band-photo-fx-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.92;
            filter: saturate(1.08) contrast(1.02);
        }

        .band-photo-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: 26px;
            z-index: 3;
            background:
                radial-gradient(circle at center, rgba(255,255,255,0) 48%, rgba(0,0,0,0.16) 100%),
                linear-gradient(90deg, rgba(10,10,18,0.15), rgba(255,255,255,0) 16%, rgba(255,255,255,0) 84%, rgba(10,10,18,0.15));
        }

        body.band-theme-silverwolf .band-photo-container {
            background:
                radial-gradient(circle at 28% 24%, rgba(98, 110, 255, 0.2) 0%, rgba(98, 110, 255, 0) 28%),
                radial-gradient(circle at 78% 68%, rgba(80, 228, 255, 0.12) 0%, rgba(80, 228, 255, 0) 24%),
                linear-gradient(135deg, rgba(14, 12, 44, 0.92), rgba(8, 10, 30, 0.88));
            border: 1px solid rgba(118, 132, 255, 0.24);
            box-shadow:
                0 0 0 1px rgba(18, 14, 48, 0.92) inset,
                0 0 18px rgba(111, 95, 255, 0.16),
                0 0 30px rgba(74, 224, 255, 0.08);
        }

        body.band-theme-silverwolf .band-photo-container::after {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0) 28%, rgba(6, 4, 18, 0.28) 100%),
                radial-gradient(circle at 24% 18%, rgba(118, 132, 255, 0.12) 0%, rgba(118, 132, 255, 0) 26%),
                radial-gradient(circle at 78% 74%, rgba(74, 224, 255, 0.08) 0%, rgba(74, 224, 255, 0) 24%);
            opacity: 0.88;
        }

        .band-photo {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            object-fit: contain;
            object-position: 50% 50%;
            -webkit-mask-image: radial-gradient(ellipse 82% 76% at center, #000 58%, rgba(0,0,0,0.96) 76%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(ellipse 82% 76% at center, #000 58%, rgba(0,0,0,0.96) 76%, rgba(0,0,0,0) 100%);
            opacity: 0;
            transform: translate3d(72px, 0, 0) scale(0.92);
            transition: opacity 0.62s cubic-bezier(0.24, 1, 0.36, 1), transform 0.82s cubic-bezier(0.22, 1, 0.36, 1);
            transform-origin: 72% 50%;
        }

        .band-photo-variant {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 2;
            object-fit: contain;
            object-position: 50% 50%;
            -webkit-mask-image: radial-gradient(ellipse 82% 76% at center, #000 58%, rgba(0,0,0,0.96) 76%, rgba(0,0,0,0) 100%);
            mask-image: radial-gradient(ellipse 82% 76% at center, #000 58%, rgba(0,0,0,0.96) 76%, rgba(0,0,0,0) 100%);
            opacity: 0;
            transform: translate3d(0, 0, 0) scale(1);
            transition: opacity 0.8s ease, filter 0.8s ease;
            filter: blur(0);
            pointer-events: none;
        }

        .band-photo-variant.enter {
            opacity: 1;
        }

        .band-photo-variant.exit {
            opacity: 0;
            filter: blur(4px);
        }

        .band-phase-wipe-layer {
            position: absolute;
            inset: 0;
            z-index: 7;
            pointer-events: none;
            overflow: hidden;
            isolation: isolate;
            --phase-wipe-x: -18%;
        }

        .band-phase-wipe-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            user-select: none;
            pointer-events: none;
            will-change: clip-path, opacity, transform, filter;
        }

        .band-phase-wipe-old {
            z-index: 1;
            filter: saturate(0.94) brightness(0.9);
        }

        .band-phase-wipe-new {
            z-index: 2;
            filter: saturate(1.14) brightness(1.03) contrast(1.04);
            clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
        }

        .band-phase-wipe-line {
            position: absolute;
            top: -18%;
            left: var(--phase-wipe-x);
            width: 12px;
            height: 136%;
            z-index: 4;
            border-radius: 999px;
            transform: translateX(-50%) skewX(-16deg);
            background:
                linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.98) 12%, var(--theme-color) 50%, rgba(255,255,255,0.98) 88%, rgba(255,255,255,0) 100%);
            box-shadow:
                0 0 12px rgba(255,255,255,0.72),
                0 0 28px var(--theme-color),
                0 0 56px rgba(255,255,255,0.22);
            mix-blend-mode: screen;
            opacity: 0.96;
        }

        .band-phase-wipe-line::before,
        .band-phase-wipe-line::after {
            content: '';
            position: absolute;
            inset: -22px -18px;
            border-radius: inherit;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.24) 18%, var(--theme-color) 50%, rgba(255,255,255,0.24) 82%, rgba(255,255,255,0) 100%);
            filter: blur(15px);
        }

        .band-phase-wipe-line::after {
            inset: -10px -48px;
            opacity: 0.55;
            filter: blur(22px);
        }

        .band-phase-wipe-spark {
            position: absolute;
            top: 50%;
            left: var(--phase-wipe-x);
            width: 34%;
            height: 58%;
            z-index: 3;
            transform: translate(-50%, -50%) skewX(-16deg);
            background:
                radial-gradient(ellipse at center, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.08) 34%, rgba(255,255,255,0) 72%),
                linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.18) 48%, rgba(255,255,255,0) 100%);
            filter: blur(10px);
            mix-blend-mode: screen;
            opacity: 0.78;
        }

        .band-photo-container.phase-wipe-active .band-photo {
            opacity: 0;
        }

        .band-desc-container {
            align-self: flex-start;
            position: relative;
            display: block;
            width: min(95%, 560px);
            min-height: 108px;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 0;
            transition: opacity 0.28s ease, transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
            max-width: 95%;
            overflow: visible;
            opacity: 0; /* 默认隐藏，由动画控制显示 */
            animation: descEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }

        .band-detail-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            padding: 0;
            backface-visibility: hidden;
            will-change: transform, opacity, filter;
        }

        .band-detail-image-panel {
            transition:
                transform 0.56s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.34s ease;
            will-change: transform, opacity;
        }

        .band-detail-image-panel {
            position: relative;
            inset: auto;
            z-index: 1;
            padding: 0;
            align-items: stretch;
            justify-content: center;
            opacity: 0;
            transform: translate3d(0, 18px, 0) scale(0.985);
            pointer-events: none;
            width: 100%;
        }

        .band-desc-container.has-attachment .band-detail-image-panel {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
        }

        .band-equipment-grid {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .band-equipment-icon {
            width: 96px;
            height: 96px;
            object-fit: cover;
            object-position: 50% 50%;
            border-radius: 0;
            display: block;
            box-shadow: none;
            background: transparent;
        }

        .progress-bar-container {
            position: relative;
            align-self: flex-start;
            width: min(100%, 95%);
            height: 3px;
            margin-top: 6px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: var(--theme-color);
            box-shadow: 0 0 20px var(--theme-color);
            transition: background 2s ease, box-shadow 2s ease;
            width: 0%;

        body.band-theme-silverwolf .progress-bar {
            background: linear-gradient(90deg, #6b7dff 0%, #8f6dff 52%, #59e4ff 100%);
            box-shadow:
                0 0 10px rgba(111, 95, 255, 0.32),
                0 0 24px rgba(89, 228, 255, 0.22);
        }

        /* 底部全局进度条 */
        .global-timeline-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 120;
            cursor: pointer;
        }

        .global-timeline-bar {
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--theme-color));
            width: 0%;
            transition: width 0.1s linear, background 2s ease;
            position: relative;
        }

        .global-timeline-bar::after {
            content: "";
            position: absolute;
            right: 0; top: 50%;
            transform: translateY(-50%);
            width: 4px; height: 100%;
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        body.band-theme-silverwolf .global-timeline-bar {
            background: linear-gradient(90deg, transparent, #6f67ff 38%, #5de0ff 100%);
        }

        body.band-theme-silverwolf .global-timeline-bar::after {
            width: 6px;
            background: #dbe0ff;
            box-shadow:
                0 0 10px rgba(219, 224, 255, 0.9),
                0 0 22px rgba(96, 98, 255, 0.46),
                0 0 36px rgba(93, 224, 255, 0.28);
        }

        .timeline-tooltip {
            position: absolute;
            bottom: 25px;
            color: #fff;
            padding: 5px 10px;
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: 0.9rem;
            pointer-events: none;
            display: none;
            z-index: 101;
            text-align: center;
            text-shadow: 0 0 10px var(--theme-color), 0 0 5px #000;
            white-space: pre; /* 支持换行显示显示乐队名 */
        }

        body.band-theme-silverwolf .timeline-tooltip {
            text-shadow:
                0 0 10px rgba(116, 130, 255, 0.72),
                0 0 20px rgba(74, 224, 255, 0.24),
                0 0 5px #000;
        }

        .timeline-tooltip-band {
            font-size: 0.7rem;
            opacity: 0.8;
            font-family: "HarmonyOS Sans SC", sans-serif;
            line-height: 1.2;
        }

        .timeline-tooltip-time {
            line-height: 1.2;

        /* 准备页面 */
        #introOverlay {

            align-items: center;
            justify-content: center;

        #introOverlay.lead-in {

            box-shadow: inset 0 0 160px rgba(0,0,0,0.46), inset 0 0 90px rgba(99, 230, 255, 0.06);

        #introOverlay.lead-in::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle, rgba(246,251,255,0.66) 0 1px, rgba(246,251,255,0) 1.8px),
                radial-gradient(circle, rgba(99,230,255,0.34) 0 1.2px, rgba(99,230,255,0) 2.2px),
                linear-gradient(90deg, rgba(99,230,255,0.03) 1px, transparent 1px),
                linear-gradient(rgba(99,230,255,0.025) 1px, transparent 1px);
            background-size: 72px 72px, 118px 118px, 96px 96px, 96px 96px;
            background-position: 0 0, 34px 18px, 0 0, 0 0;

        @keyframes introBlueDrift {
            0% { transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }

        @keyframes introParticleDrift {
            0% {
                background-position: 0 0, 34px 18px, 0 0, 0 0;

            50% {
                opacity: 0.78;
            }
            100% {
                background-position: -72px 72px, 152px -100px, -96px 0, 0 -96px;

            }
        }

        .intro-guide-labels {

            transform: skewX(-18deg) translate3d(-120vw, 0, 0);

                transform 0.94s cubic-bezier(0.22, 0.96, 0.2, 1),

        @keyframes introRadarShapePulse {

        /* 全屏模式下的 UI 隐藏 */
        :fullscreen body { cursor: none; }
        :fullscreen .global-timeline-container,
        :fullscreen #globalTimeline,
        :fullscreen .progress-bar-container,
        :fullscreen .session-timer { 
            display: none !important; 
        }

        .fade-out { 
            opacity: 0; 
            transform: translate3d(58px, 0, 0) scale(0.92) skewX(-5deg); 
            filter: blur(10px);
            transition: all 0.42s cubic-bezier(0.46, 0.02, 0.78, 0.2);
        }

        /* MVP 乐队底图容器 */
        .mvp-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* 在背景渐变之上，在容器 container 之下 */
            pointer-events: none;
            overflow: hidden;
        }

        .mvp-bg-container::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            background:
                radial-gradient(circle at 16% 24%, rgba(255,231,166,0.2) 0%, rgba(255,231,166,0) 28%),
                radial-gradient(circle at 20% 62%, rgba(255,197,74,0.14) 0%, rgba(255,197,74,0) 34%),
                linear-gradient(90deg, rgba(255,205,92,0.14) 0%, rgba(255,205,92,0.07) 16%, rgba(255,205,92,0) 48%),
                linear-gradient(135deg, rgba(255,245,210,0.1), rgba(0,0,0,0) 58%);
            mix-blend-mode: screen;
            transition: opacity 0.5s ease;
        }

        .mvp-bg-container::after {
            content: 'MVP';
            position: absolute;
            top: 18px;
            left: 26px;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            color: transparent;
            font-family: "Cormorant Garamond", "Noto Serif SC", "Times New Roman", serif;
            font-size: 4.25rem;
            font-style: italic;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 0.12em;
            background:
                linear-gradient(180deg, #ffffff 0%, #fffdf5 8%, #fff6cf 20%, #ffe89f 36%, #ffd661 54%, #ffc126 72%, #d89000 88%, #8b5200 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 2.2px rgba(88, 47, 0, 0.96);
            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.92),
                0 3px 0 rgba(255, 244, 196, 0.62),
                0 0 10px rgba(255, 248, 209, 0.72),
                0 0 24px rgba(255, 219, 116, 0.48),
                0 0 44px rgba(255, 195, 60, 0.3),
                0 10px 24px rgba(0, 0, 0, 0.38);
            transition: opacity 0.35s ease, transform 0.35s ease;
            transform: translate3d(-14px, -6px, 0) skewX(-12deg) rotate(-7deg) scale(0.92);
        }

        .mvp-bg-container.mvp-active::before {
            opacity: 1;
            animation: mvpGoldAura 3.6s ease-in-out infinite alternate;
        }

        .mvp-bg-container.mvp-active::after {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        .mvp-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: contain; /* 改为 contain，防止裁切 */
            object-position: left center; /* 靠左对齐 */
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.78) 24%, rgba(0,0,0,0.34) 48%, rgba(0,0,0,0.04) 66%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to right, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.78) 24%, rgba(0,0,0,0.34) 48%, rgba(0,0,0,0.04) 66%, rgba(0,0,0,0) 100%);
            transition: transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease;
            transform: translateX(-100%) scale(var(--user-image-scale, 1)); /* 初始在左侧外部 */
            transform-origin: left center;
            opacity: 0;
            filter: saturate(1.02) brightness(0.98);
        }

        .mvp-bg-image.active {
            opacity: 1;
            transform: translateX(0) scale(var(--user-image-scale, 1)); /* 滑动到原位即左侧对齐 */
        }

        .mvp-bg-container.mvp-active .mvp-bg-image.active {
            filter:
                sepia(0.14)
                saturate(1.08)
                brightness(1.02)
                drop-shadow(0 0 10px rgba(248,211,126,0.08))
                drop-shadow(0 0 26px rgba(219,160,42,0.08));
        }

        .mvp-bg-image.exit {
            transform: translateX(0) scale(var(--user-image-scale, 1)); /* 退出时不移动位置 */
            opacity: 0; /* 仅逐渐消失 */
        }

        @keyframes mvpGoldAura {
            0% {
                filter: blur(0px) brightness(1);
                transform: translate3d(0, 0, 0) scale(1);
            }
            50% {
                filter: blur(1px) brightness(1.06);
                transform: translate3d(1.2vw, -1vh, 0) scale(1.015);
            }
            100% {
                filter: blur(0px) brightness(1.02);
                transform: translate3d(-0.8vw, 0.8vh, 0) scale(1.01);
            }
        }

        /* ===== 抽卡出金动画 CSS ===== */

            content: "";
            position: absolute;
            inset: -24vh -18vw;
            pointer-events: none;
        }

        #outroOverlay::before {
            background:
                linear-gradient(108deg, rgba(255,255,255,0) 0%, rgba(130, 182, 255, 0.08) 36%, rgba(255,255,255,0.22) 49%, rgba(96, 158, 255, 0.08) 62%, rgba(255,255,255,0) 100%);
            transform: translate3d(-120vw, 0, 0) skewX(-18deg);
            opacity: 0;
        }

        #outroOverlay.active::before {
            animation: outroDiagonalSweep 1.05s cubic-bezier(0.22, 0.92, 0.24, 1) both;
        }

        #outroOverlay::after {
            background:
                radial-gradient(circle at 50% 50%, rgba(120, 180, 255, 0.12), rgba(120, 180, 255, 0) 56%),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 82px),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 82px);
            opacity: 0;
            transform: scale(1.08);
            transition: opacity 900ms ease, transform 1400ms ease;
        }

        #outroOverlay.active::after {
            opacity: 0.62;
            transform: scale(1);
        }

        @keyframes outroDiagonalSweep {
            0% {
                opacity: 0;
                transform: translate3d(-120vw, 0, 0) skewX(-18deg);
            }
            16% {
                opacity: 0.95;
            }
            100% {
                opacity: 0.28;
                transform: translate3d(120vw, 0, 0) skewX(-18deg);
            }
        }

        .outro-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: none;
            filter: none;
            transition: opacity 520ms cubic-bezier(0.2, 0.9, 0.24, 1);
            backface-visibility: hidden;
            will-change: opacity;
        }

        #outroOverlay.video-ready .outro-video {
            opacity: 1;
            transform: none;
            filter: none;
        }

        #outroOverlay.show-thanks .outro-video {
            opacity: 0 !important;
        }

        .outro-fallback {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 50%, rgba(55, 110, 220, 0.3), rgba(12, 20, 36, 0.06) 44%, rgba(4, 7, 14, 0.94) 82%),
                linear-gradient(132deg, rgba(21, 42, 87, 0.62), rgba(4, 7, 14, 0.94));
            opacity: 0.92;
            transition: opacity 820ms ease;
        }

        #outroOverlay.video-ready .outro-fallback {
            opacity: 0.1;
        }

        #outroOverlay.fallback-only .outro-fallback {
            opacity: 1;
        }

        .outro-thanks {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate3d(-50%, -50%, 0) scale(0.92);
            font-family: "Noto Serif SC", "Microsoft YaHei", serif;
            font-weight: 900;
            font-size: clamp(68px, 8vw, 168px);
            letter-spacing: 0.1em;
            white-space: nowrap;
            color: #fef7df;
            opacity: 0;
            text-shadow:
                0 0 24px rgba(255, 241, 186, 0.46),
                0 0 58px rgba(116, 176, 255, 0.24),
                0 6px 18px rgba(0, 0, 0, 0.44);
            transition: opacity 520ms ease, transform 620ms cubic-bezier(0.22, 0.92, 0.24, 1);
            pointer-events: none;
            z-index: 3;
        }

        #outroOverlay.show-thanks .outro-thanks,
        #outroOverlay.ended .outro-thanks {
            opacity: 1;
            transform: translate3d(-50%, -50%, 0) scale(1);
        }

        body.outro-mode #particles-canvas,
        body.outro-mode #brandDecor,
        body.outro-mode #mvpBgContainer,
        body.outro-mode #gachaOverlay,
        body.outro-mode .container {
            visibility: hidden !important;
        }
    </style>

        function normalizePhaseRatio(value, fallback = 0.5) {

        function buildMidPhaseBand(baseBand, vc) {
            const phase = baseBand?.midPhase;
            if (!phase || !phase.enabled) return null;

            const phasePoints = ensureLength(Array.isArray(phase.points) ? phase.points : [], vc, i => {
                const fallback = Array.isArray(baseBand.points) ? baseBand.points[i] : 0;
                return Number.isFinite(Number(fallback)) ? Number(fallback) : 0;
            }).map((value, i) => {
                const n = Number(value);
                if (Number.isFinite(n)) return n;
                const fallback = Array.isArray(baseBand.points) ? Number(baseBand.points[i]) : 0;
                return Number.isFinite(fallback) ? fallback : 0;
            });

            return {
                ...baseBand,
                points: phasePoints,
                colorIndex: phase.colorIndex !== undefined && phase.colorIndex !== null && phase.colorIndex !== '' && Number.isFinite(Number(phase.colorIndex))
                    ? Number(phase.colorIndex)
                    : baseBand.colorIndex,
                photoName: String(phase.photoName || '').trim() || undefined,

            if (!['tech', 'pulse', 'orbit', 'off'].includes(CONFIG.RADAR_AUDIO_FX_MODE)) CONFIG.RADAR_AUDIO_FX_MODE = 'tech';

                const points = ensureLength(rawPoints, vc, i => CONFIG.MIN_SCORES[i] ?? 0)

                        if (Number.isFinite(n)) return n;
                        const minScore = Number(CONFIG.MIN_SCORES[i] ?? 0);

                const midPhase = item?.midPhase && typeof item.midPhase === 'object'

        // 维度映射规则：

        // maxScore -> 雷达外圈(1)
        // > maxScore 允许继续外扩（>1），< minScore 则压到中心（0）
        function getRadarRatio(value, index) {
            const minScore = Number(CONFIG.MIN_SCORES[index] ?? 0);
            const maxScore = Number(CONFIG.BASE_MAX_SCORES[index] ?? 10);
            const score = normalizeScore(value);
            if (!Number.isFinite(minScore) || !Number.isFinite(maxScore) || maxScore <= minScore) {
                return score >= maxScore ? 1 : 0;
            }
            return Math.max(0, (score - minScore) / (maxScore - minScore));

        function rebuildDerivedData() {

                const basePoints = Array.isArray(b.points) ? b.points : [];

                    const s = val.toString();
                    const dotIdx = s.indexOf('.');
                    return dotIdx === -1 ? 0 : s.length - dotIdx - 1;
                });

                const baseBand = {
                    ...b,
                    precisions: basePrecisions,
                    isGoat: mvplist.includes(b.name),
                    duration: midBandRaw ? Math.max(1, Math.round(baseDuration * basePhaseRatio)) : baseDuration,
                    phaseRole: 'base',
                    phaseParentName: b.name,
                    phaseKeepIdentity: false,
                    ...basePreset

                derivedBands.push(baseBand);

                        const dotIdx = s.indexOf('.');

                        colorIndex: baseBand.colorIndex,

        function formatRadarValue(value, index) {
            // 获取当前乐队当前维度预期的精度
            let precision = 0;
            if (currentIndex !== -1 && bands[currentIndex]) {
                precision = bands[currentIndex].precisions[index];

            const normalizedValue = normalizeScore(value);

            if (CONFIG.REAL_PERCENTAGE && CONFIG.REAL_PERCENTAGE[index]) {
                return parseFloat(normalizedValue.toFixed(precision)).toString() + "%";
            }

            // 如果该维度需要显示为百分比
            if (CONFIG.USE_PERCENTAGE && CONFIG.USE_PERCENTAGE[index]) {
                // 百分比按当前维度量程换算：
                // min -> 0%，max -> 100%
                // 例如量程 0~100，填 70 显示 70%
                let pctValue = getRadarRatio(normalizedValue, index) * 100;
                return parseFloat(pctValue.toFixed(precision)).toString() + "%";
            }

            let displayValue = parseFloat(normalizedValue.toFixed(precision)).toString();
            
            // 如果精度要求为0 (整数)，则显式进行四舍五入
            if (precision === 0) {
                let intVal = Math.round(normalizedValue);
                return intVal.toString();
            }

            return displayValue;
        }

        function syncRadarBackgroundCleaner(centerX, centerY, radius, vertices) {
            const cleaner = document.getElementById('radarBgCleaner');
            if (!cleaner || !Array.isArray(vertices) || !vertices.length) return;

            const rect = radarCanvas.getBoundingClientRect();
            const scaleX = rect.width / Math.max(1, radarCanvas.width);
            const scaleY = rect.height / Math.max(1, radarCanvas.height);
            const points = vertices.map(vertex => {
                const x = rect.left + (centerX + radius * vertex.cos) * scaleX;
                const y = rect.top + (centerY + radius * vertex.sin) * scaleY;
                return `${x.toFixed(2)}px ${y.toFixed(2)}px`;
            }).join(', ');
            cleaner.style.clipPath = `polygon(${points})`;
            cleaner.style.opacity = '1';

        function getTimeSegmentAt(timeMs, inclusiveEnd = false) {
            if (!Array.isArray(timeSegments) || !timeSegments.length) return null;

            let left = 0;
            let right = timeSegments.length - 1;
            while (left <= right) {
                const mid = (left + right) >> 1;
                const segment = timeSegments[mid];
                const afterStart = timeMs >= segment.start;
                const beforeEnd = inclusiveEnd ? timeMs <= segment.end : timeMs < segment.end;
                if (afterStart && beforeEnd) return segment;
                if (timeMs < segment.start) right = mid - 1;
                else left = mid + 1;
            }

            if (inclusiveEnd && timeMs === totalDuration) {
                return timeSegments[timeSegments.length - 1];
            }
            return null;
        }

        function getTimeSegmentByBandIndex(bandIndex) {
            if (!Number.isInteger(bandIndex) || bandIndex < 0) return null;
            const direct = timeSegments[bandIndex];
            if (direct && direct.bandIndex === bandIndex) return direct;
            return timeSegments.find(segment => segment.bandIndex === bandIndex) || null;
        }

        function createPhotoWipeLayer(photoContainer, oldPhotoCandidate, newPhotoCandidate, sessionId, onComplete = null, onMidpoint = null) {
            if (!photoContainer || !oldPhotoCandidate || !newPhotoCandidate) return null;
            clearPhotoWipeLayer(photoContainer);

            const layer = document.createElement('div');
            layer.className = 'band-phase-wipe-layer';

            const oldImg = document.createElement('img');
            oldImg.className = 'band-phase-wipe-image band-phase-wipe-old';
            oldImg.src = oldPhotoCandidate.url;
            applyImageMeta(oldImg, oldPhotoCandidate.name, { fit: 'contain', x: 50, y: 50, scale: 1 }, true);
            setElementUserScale(oldImg);

            const newImg = document.createElement('img');
            newImg.className = 'band-phase-wipe-image band-phase-wipe-new';
            newImg.src = newPhotoCandidate.url;
            applyImageMeta(newImg, newPhotoCandidate.name, { fit: 'contain', x: 50, y: 50, scale: 1 }, true);
            setElementUserScale(newImg);

            const spark = document.createElement('span');
            spark.className = 'band-phase-wipe-spark';

            const line = document.createElement('span');
            line.className = 'band-phase-wipe-line';

            layer.appendChild(oldImg);
            layer.appendChild(newImg);
            layer.appendChild(spark);
            layer.appendChild(line);
            photoContainer.appendChild(layer);

            const duration = Math.max(560, Math.round(ANIM_DURATION * 0.72));
            const startLeft = -18;
            const endLeft = 118;
            const diagonalWidth = 24;
            const settleLeft = 112;
            const startTime = performance.now();
            const midpointX = 50;
            let midpointHandled = false;

            photoContainer.classList.add('phase-wipe-active');

            const animate = now => {
                if (!isUiTransitionActive(sessionId)) return;
                const elapsed = Math.max(0, now - startTime);
                const progress = Math.min(1, elapsed / duration);
                const eased = 1 - Math.pow(1 - progress, 3);
                const lineX = startLeft + (endLeft - startLeft) * eased;
                layer.style.setProperty('--phase-wipe-x', `${lineX.toFixed(2)}%`);
                const topEdge = Math.max(0, Math.min(100, lineX));
                const bottomEdge = Math.max(0, Math.min(100, lineX + diagonalWidth));
                newImg.style.clipPath = `polygon(0 0, ${topEdge.toFixed(2)}% 0, ${bottomEdge.toFixed(2)}% 100%, 0 100%)`;

                if (!midpointHandled && lineX >= midpointX) {
                    midpointHandled = true;
                    oldImg.remove();
                    if (typeof onMidpoint === 'function') {
                        onMidpoint();
                    }
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                    return;
                }

                layer.style.setProperty('--phase-wipe-x', `${settleLeft}%`);
                newImg.style.clipPath = 'polygon(0 0, 100% 0, 100% 100%, 0 100%)';
                requestAnimationFrame(() => {
                    if (!isUiTransitionActive(sessionId)) return;
                    clearPhotoWipeLayer(photoContainer);
                    if (typeof onComplete === 'function') {
                        onComplete();
                    }
                });
            };

            requestAnimationFrame(animate);
            return layer;
        }

        function playlistsEqual(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }

        function getPlaylistCycleDuration(audio = null) {
            const durationsReady = musicTrackDurations.length === musicPlaylist.length
                && musicTrackDurations.every(d => Number.isFinite(d) && d > 0);
            if (durationsReady) {
                return musicTrackDurations.reduce((sum, d) => sum + d, 0);
            }
            const fallbackDuration = Number(audio?.duration);
            if (musicPlaylist.length <= 1 && Number.isFinite(fallbackDuration) && fallbackDuration > 0) {
                return fallbackDuration;
            }
            return 0;
        }

        function ensureMusicTrackDurations() {
            musicTrackDurations = Array(musicPlaylist.length).fill(NaN);
            musicPlaylist.forEach((src, index) => {
                const probe = new Audio();
                probe.preload = "metadata";
                probe.addEventListener("loadedmetadata", () => {
                    const d = Number(probe.duration);
                    if (Number.isFinite(d) && d > 0) musicTrackDurations[index] = d;
                }, { once: true });
                probe.src = src;
            });
        }

        function setMusicTrack(audio, nextIndex, seekTime = 0, autoPlay = false) {
            if (!audio || !musicPlaylist.length) return;
            const len = musicPlaylist.length;
            const index = ((nextIndex % len) + len) % len;
            const src = musicPlaylist[index];
            const prevSrc = audio.dataset.trackSrc || "";
            const switched = prevSrc !== src;
            currentMusicTrackIndex = index;

            const applySeek = () => {
                const dur = Number(audio.duration);
                const t = Number.isFinite(dur) && dur > 0
                    ? Math.max(0, Math.min(seekTime, Math.max(0, dur - 0.05)))
                    : Math.max(0, seekTime);
                try { audio.currentTime = t; } catch (_) {}
                if (autoPlay) audio.play().catch(() => {});
            };

            if (switched) {
                audio.dataset.trackSrc = src;
                audio.src = src;
                audio.addEventListener("loadedmetadata", applySeek, { once: true });
                if (autoPlay) audio.play().catch(() => {});
                return;
            }
            applySeek();
        }

        function bindMusicEndedHandler(audio) {
            if (!audio || musicEndedHandlerBound) return;
            audio.addEventListener("ended", () => {
                const len = Math.max(1, musicPlaylist.length);
                const isLastTrack = currentMusicTrackIndex >= len - 1;
                if (outroActive) {
                    if (!isLastTrack) {
                        setMusicTrack(audio, currentMusicTrackIndex + 1, 0, true);
                    } else {
                        finishOutroSequence();
                    }
                    return;
                }

                const next = (currentMusicTrackIndex + 1) % len;
                if (next === 0) musicPlaybackCycles += 1;
                setMusicTrack(audio, next, 0, true);
            });
            musicEndedHandlerBound = true;
        }

        function applyMusicPlaylist() {
            const audio = document.getElementById("bgMusic");
            if (!audio) return;
            const configured = getConfiguredMusicPlaylist();
            const changed = !playlistsEqual(musicPlaylist, configured);
            musicPlaylist = configured;
            if (changed || !audio.dataset.trackSrc) {
                currentMusicTrackIndex = 0;
                musicPlaybackCycles = 0;
                setMusicTrack(audio, 0, 0, false);
                ensureMusicTrackDurations();
            }
            bindMusicEndedHandler(audio);
        }

        function getConfiguredOutroVideoCandidates() {
            const raw = CONFIG.OUTRO_VIDEO;
            let items = [];
            if (Array.isArray(raw)) items = raw;
            else if (typeof raw === "string") items = raw.split(/[,\n;|]/g);
            items = items.map(s => String(s || "").trim()).filter(Boolean);
            if (items.length === 1) {
                const primary = items[0];
                const dot = primary.lastIndexOf(".");
                if (dot > 0) {
                    const base = primary.slice(0, dot);
                    const ext = primary.slice(dot);
                    items = [
                        `${base}-lite${ext}`,
                        `${base}-720p${ext}`,
                        primary
                    ];
                }
            } else if (!items.length) {
                items = [
                    "/assets/video/ending-lite.mp4",
                    "/assets/video/ending-720p.mp4",
                    "/assets/video/ending.mp4",
                    "/assets/video/ending.webm",
                    "/assets/video/ending.mov",
                    "/assets/video/outro.mp4",
                    "/assets/video/outro.webm",
                    "/assets/video/final.mp4",
                    "/assets/video/final.webm"
                ];
            }
            return Array.from(new Set(items));
        }

        function getOutroTransitionMs() {
            const raw = Number(CONFIG.OUTRO_TRANSITION_MS);
            return Number.isFinite(raw) ? clampNumber(raw, 300, 4000) : 1100;

        function clearOutroRevealTimer() {
