<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Radar - 战力雷达图</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Serif+SC:wght@700;900&family=Orbitron:wght@500;700;900&family=ZCOOL+QingKe+HuangYou&family=ZCOOL+XiaoWei&display=swap");
        /* 引入鸿蒙字体 (使用更稳定的全局地址) */
        @import url("https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/harmonyos-sans/1.1.0/style.css");

        :root {
            --theme-color: #00ffff;
            --bg-color-1: #0f1015;
            --bg-color-2: #1a1a2e;
            --radar-shift-y: 0px;
            --brand-gold: #d4ab59;
            --brand-gold-bright: #f8e6b7;
            --brand-gold-deep: #6f4713;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: "HarmonyOS Sans SC", "PingFang SC", "Lantinghei SC", "Microsoft YaHei", "HanHei SC", "Helvetica Neue", "Open Sans", Arial, sans-serif; 
            overflow: hidden; 
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2), #050508, #111);
            background-size: 400% 400%;
            animation: gradientBG 30s ease infinite; 
            color: #fff; 
            transition: all 2s ease; 
        }

        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1005; /* 初始置顶以显示粒子 */
            pointer-events: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #brandDecor {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .brand-security-pattern,
        .brand-sky-curtain,
        .brand-emblem,
        .brand-scan-badge,
        .brand-watermark,
        .brand-corner,
        .brand-diamond,
        .brand-serial {
            position: absolute;
            pointer-events: none;
        }

        .brand-security-pattern {
            inset: -10%;
            opacity: 0.62;
            background:
                radial-gradient(circle at 18% 24%, rgba(255, 232, 176, 0.075) 0 1.5px, rgba(255, 232, 176, 0) 2px),
                radial-gradient(circle at 78% 70%, rgba(255, 214, 126, 0.058) 0 1.5px, rgba(255, 214, 126, 0) 2px),
                repeating-linear-gradient(118deg, rgba(255, 223, 148, 0.03) 0 2px, rgba(255, 223, 148, 0) 2px 24px),
                repeating-radial-gradient(circle at 50% 50%, rgba(255, 220, 136, 0.026) 0 1px, rgba(255, 220, 136, 0) 1px 26px),
                linear-gradient(90deg, rgba(255, 219, 140, 0.02), rgba(255, 219, 140, 0) 16%, rgba(255, 219, 140, 0) 84%, rgba(255, 219, 140, 0.02));
            -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.12), #000 26%, #000 72%, rgba(0, 0, 0, 0.18));
            mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.12), #000 26%, #000 72%, rgba(0, 0, 0, 0.18));
            animation: brandSecurityDrift 42s linear infinite;
        }

        .brand-sky-curtain {
            display: none !important;
        }

        .brand-emblem {
            left: -2vw;
            top: 50%;
            width: min(56vw, 940px);
            height: min(34vw, 520px);
            transform: translateY(-50%) rotate(-11deg) skewX(-12deg);
            border-radius: 36px;
            opacity: 0.22;
            background:
                linear-gradient(90deg, rgba(255, 232, 176, 0.12), rgba(255, 232, 176, 0) 18%, rgba(255, 232, 176, 0) 82%, rgba(255, 232, 176, 0.08)),
                repeating-linear-gradient(90deg, rgba(255, 221, 150, 0.08) 0 1px, rgba(255, 221, 150, 0) 1px 34px),
                repeating-linear-gradient(0deg, rgba(255, 221, 150, 0.06) 0 1px, rgba(255, 221, 150, 0) 1px 26px),
                linear-gradient(135deg, rgba(255, 245, 214, 0.08), rgba(255, 214, 126, 0.04) 42%, rgba(255, 214, 126, 0.01) 76%);
            border: 1px solid rgba(255, 232, 176, 0.16);
            box-shadow:
                inset 0 0 0 1px rgba(255, 244, 214, 0.06),
                inset 0 0 34px rgba(255, 214, 126, 0.03),
                0 0 22px rgba(255, 219, 134, 0.06);
            -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0) 0%, #000 10%, #000 74%, rgba(0, 0, 0, 0) 100%);
            mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0) 0%, #000 10%, #000 74%, rgba(0, 0, 0, 0) 100%);
            filter: blur(0.2px);
            animation: brandEmblemFloat 18s ease-in-out infinite alternate;
        }

        .brand-emblem::before,
        .brand-emblem::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
        }

        .brand-emblem::before {
            inset: 7% 9%;
            border: 1px solid rgba(255, 232, 176, 0.14);
            background:
                linear-gradient(90deg, rgba(255, 232, 176, 0.12), rgba(255, 232, 176, 0) 22%, rgba(255, 232, 176, 0) 78%, rgba(255, 232, 176, 0.08)),
                linear-gradient(0deg, rgba(255, 232, 176, 0.06), rgba(255, 232, 176, 0));
        }

        .brand-emblem::after {
            inset: 16% 12%;
            background:
                linear-gradient(90deg, rgba(255, 232, 176, 0) 0%, rgba(255, 232, 176, 0.12) 18%, rgba(255, 232, 176, 0.12) 82%, rgba(255, 232, 176, 0) 100%) center / 100% 1px no-repeat,
                linear-gradient(0deg, rgba(255, 232, 176, 0) 0%, rgba(255, 232, 176, 0.08) 18%, rgba(255, 232, 176, 0.08) 82%, rgba(255, 232, 176, 0) 100%) center / 1px 100% no-repeat,
                linear-gradient(118deg, rgba(255, 232, 176, 0) 34%, rgba(255, 232, 176, 0.1) 50%, rgba(255, 232, 176, 0) 66%),
                linear-gradient(90deg, rgba(255, 232, 176, 0.06) 0 16%, rgba(255, 232, 176, 0) 16% 84%, rgba(255, 232, 176, 0.04) 84% 100%);
        }

        .brand-watermark {
            left: 4vw;
            top: 52%;
            transform: translateY(-50%) rotate(-13deg);
            opacity: 0.15;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 18px rgba(255, 224, 146, 0.12));
            animation: brandWatermarkFloat 16s ease-in-out infinite alternate;
        }

        .brand-watermark-cn,
        .brand-watermark-en {
            display: block;
        }

        .brand-watermark-cn {
            font-family: "Cormorant Garamond", "Noto Serif SC", "Times New Roman", serif;
            font-size: clamp(78px, 8.4vw, 168px);
            font-weight: 900;
            line-height: 0.94;
            letter-spacing: 0.22em;
            padding-left: 0.22em;
            color: transparent;
            background: linear-gradient(180deg, rgba(255,255,255,0.58) 0%, rgba(255,242,206,0.54) 16%, rgba(244,214,145,0.38) 48%, rgba(153,98,28,0.16) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-stroke: 1px rgba(255, 232, 176, 0.18);
            text-shadow:
                0 0 6px rgba(255, 242, 206, 0.16),
                0 0 22px rgba(212, 171, 89, 0.08);
        }

        .brand-watermark-en {
            margin-top: 10px;
            margin-left: 22px;
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(12px, 1vw, 20px);
            font-weight: 700;
            letter-spacing: 0.62em;
            color: rgba(255, 232, 176, 0.4);
            text-shadow: 0 0 10px rgba(255, 214, 126, 0.12);
        }

        .brand-corner {
            width: 280px;
            height: 200px;
            opacity: 0.62;
            filter: drop-shadow(0 0 10px rgba(255, 221, 146, 0.08));
        }

        .brand-corner::before,
        .brand-corner::after {
            content: '';
            position: absolute;
            inset: 0;
        }

        .brand-corner::before {
            background:
                linear-gradient(90deg, rgba(255, 232, 176, 0.48), rgba(255, 232, 176, 0)) top left / 100% 1px no-repeat,
                linear-gradient(180deg, rgba(255, 232, 176, 0.48), rgba(255, 232, 176, 0)) top left / 1px 100% no-repeat,
                linear-gradient(90deg, rgba(255, 232, 176, 0.28), rgba(255, 232, 176, 0)) top 18px left 0 / 118px 1px no-repeat,
                linear-gradient(180deg, rgba(255, 232, 176, 0.28), rgba(255, 232, 176, 0)) top left 18px / 1px 108px no-repeat;
        }

        .brand-corner::after {
            background:
                linear-gradient(135deg, rgba(255, 232, 176, 0.22), rgba(255, 232, 176, 0) 62%) top left / 138px 138px no-repeat,
                radial-gradient(circle at 26px 26px, rgba(255, 232, 176, 0.24) 0 2px, rgba(255, 232, 176, 0) 4px),
                linear-gradient(90deg, rgba(255, 232, 176, 0.18), rgba(255, 232, 176, 0)) top 44px left 18px / 164px 1px no-repeat;
        }

        .brand-corner-top-right {
            top: 28px;
            right: 30px;
            transform: scaleX(-1);
        }

        .brand-corner-bottom-left {
            bottom: 36px;
            left: 26px;
            transform: scaleY(-1);
        }

        .brand-serial {
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.34em;
            color: rgba(255, 230, 170, 0.34);
            text-shadow: 0 0 10px rgba(255, 219, 140, 0.08);
            white-space: nowrap;
        }

        .brand-serial-top {
            top: 54px;
            right: 58px;
        }

        .brand-serial-bottom {
            bottom: 58px;
            left: 44px;
        }

        .brand-scan-badge {
            top: 28px;
            left: 34px;
            width: clamp(162px, 11.6vw, 208px);
            height: clamp(112px, 8.2vw, 146px);
            z-index: 1;
            overflow: hidden;
            border-radius: 22px;
            border: 1px solid rgba(130, 224, 255, 0.16);
            background:
                linear-gradient(180deg, rgba(7, 17, 28, 0.46), rgba(5, 10, 18, 0.14)),
                radial-gradient(circle at 18% 20%, rgba(99, 230, 255, 0.14), rgba(99, 230, 255, 0) 44%),
                linear-gradient(120deg, rgba(112, 198, 255, 0.05), rgba(255, 255, 255, 0) 48%, rgba(99, 230, 255, 0.04));
            box-shadow:
                inset 0 0 0 1px rgba(230, 250, 255, 0.04),
                inset 0 0 26px rgba(90, 205, 255, 0.05),
                0 0 28px rgba(99, 230, 255, 0.08);
            backdrop-filter: blur(4px);
            contain: layout paint;
            display: none !important;
        }

        .brand-scan-badge::before,
        .brand-scan-badge::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .brand-scan-badge::before {
            background:
                linear-gradient(90deg, rgba(99, 230, 255, 0.18), rgba(99, 230, 255, 0)) top 14px left 16px / 88px 1px no-repeat,
                linear-gradient(180deg, rgba(99, 230, 255, 0.18), rgba(99, 230, 255, 0)) top 14px left 16px / 1px 54px no-repeat,
                linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0)) bottom 14px right 18px / 74px 1px no-repeat,
                linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0)) bottom 14px right 18px / 1px 42px no-repeat;
            opacity: 0.9;
        }

        .brand-scan-badge::after {
            inset: 10px;
            border-radius: 16px;
            border: 1px solid rgba(130, 224, 255, 0.06);
        }

        .brand-scan-grid {
            position: absolute;
            inset: 10px;
            border-radius: 16px;
            opacity: 0.38;
            background:
                repeating-linear-gradient(90deg, rgba(110, 214, 255, 0.08) 0 1px, rgba(110, 214, 255, 0) 1px 22px),
                repeating-linear-gradient(0deg, rgba(110, 214, 255, 0.06) 0 1px, rgba(110, 214, 255, 0) 1px 20px),
                linear-gradient(125deg, rgba(99, 230, 255, 0.08), rgba(99, 230, 255, 0) 52%);
            animation: brandScanGridShift 12s linear infinite;
        }

        .brand-scan-ring {
            position: absolute;
            left: 16px;
            top: 17px;
            width: clamp(66px, 4.8vw, 86px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 1px solid rgba(132, 230, 255, 0.22);
            box-shadow:
                inset 0 0 18px rgba(88, 208, 255, 0.08),
                0 0 18px rgba(99, 230, 255, 0.08);
            background:
                radial-gradient(circle at center, rgba(212, 249, 255, 0.16) 0 7%, rgba(99, 230, 255, 0.08) 7% 28%, rgba(99, 230, 255, 0) 28%),
                radial-gradient(circle at center, rgba(99, 230, 255, 0.16) 0 1px, rgba(99, 230, 255, 0) 2px),
                conic-gradient(from 0deg, rgba(99, 230, 255, 0.22), rgba(99, 230, 255, 0.04) 28%, rgba(99, 230, 255, 0) 52%, rgba(255, 255, 255, 0.16) 78%, rgba(99, 230, 255, 0.22));
            animation: brandScanPulse 4.8s ease-in-out infinite;
        }

        .brand-scan-ring::before,
        .brand-scan-ring::after {
            content: '';
            position: absolute;
            inset: 12%;
            border-radius: 50%;
            border: 1px solid rgba(225, 249, 255, 0.1);
        }

        .brand-scan-ring::after {
            inset: 28%;
            border-color: rgba(99, 230, 255, 0.18);
        }

        .brand-scan-sweep {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 46%;
            height: 1px;
            transform-origin: 0 50%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), rgba(99, 230, 255, 0.36), rgba(99, 230, 255, 0));
            box-shadow:
                0 0 12px rgba(255, 255, 255, 0.16),
                0 0 18px rgba(99, 230, 255, 0.16);
            animation: brandScanSweep 3.6s linear infinite;
        }

        .brand-scan-node {
            position: absolute;
            width: 5px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: rgba(232, 251, 255, 0.9);
            box-shadow: 0 0 10px rgba(99, 230, 255, 0.24);
            animation: brandScanBlink 2.8s ease-in-out infinite;
        }

        .brand-scan-node-a { top: 14%; left: 68%; animation-delay: -0.4s; }
        .brand-scan-node-b { top: 68%; left: 24%; animation-delay: -1.2s; }
        .brand-scan-node-c { top: 62%; left: 76%; animation-delay: -2s; }

        .brand-scan-meta {
            position: absolute;
            right: 14px;
            top: 16px;
            width: calc(100% - 112px);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .brand-scan-chip {
            padding: 4px 8px 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(153, 235, 255, 0.18);
            background: linear-gradient(90deg, rgba(77, 186, 255, 0.16), rgba(77, 186, 255, 0.04));
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.24em;
            color: rgba(229, 250, 255, 0.92);
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(99, 230, 255, 0.14);
        }

        .brand-scan-value {
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(18px, 1.5vw, 26px);
            font-weight: 900;
            letter-spacing: 0.16em;
            color: rgba(244, 252, 255, 0.94);
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.08),
                0 0 18px rgba(99, 230, 255, 0.16);
        }

        .brand-scan-track {
            position: relative;
            width: 100%;
            height: 10px;
            border-radius: 999px;
            overflow: hidden;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04), rgba(99, 230, 255, 0.08));
            box-shadow: inset 0 0 0 1px rgba(122, 222, 255, 0.08);
        }

        .brand-scan-track span {
            position: absolute;
            inset: 1px;
            width: 58%;
            border-radius: inherit;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.76), rgba(99, 230, 255, 0.52) 34%, rgba(99, 230, 255, 0.08));
            box-shadow:
                0 0 12px rgba(99, 230, 255, 0.16),
                inset 0 0 6px rgba(255, 255, 255, 0.2);
            animation: brandScanTrackMove 4.8s cubic-bezier(0.42, 0, 0.22, 1) infinite;
        }

        .brand-scan-track span::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transform: translateY(-50%);
            background: rgba(246, 252, 255, 0.94);
            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.18),
                0 0 14px rgba(99, 230, 255, 0.22);
        }

        .brand-scan-stats {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: rgba(198, 241, 255, 0.52);
        }

        .brand-scan-stats span {
            position: relative;
            padding-left: 10px;
        }

        .brand-scan-stats span::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            transform: translateY(-50%);
            background: rgba(227, 249, 255, 0.86);
            box-shadow: 0 0 10px rgba(99, 230, 255, 0.2);
        }

        @keyframes brandScanGridShift {
            0% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(-10px, 6px, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        @keyframes brandScanPulse {
            0%, 100% { transform: scale(1); opacity: 0.88; }
            50% { transform: scale(1.032); opacity: 1; }
        }

        @keyframes brandScanSweep {
            0% { transform: rotate(-28deg) translateX(0); opacity: 0.86; }
            46% { opacity: 0.96; }
            100% { transform: rotate(332deg) translateX(0); opacity: 0.8; }
        }

        @keyframes brandScanBlink {
            0%, 100% { opacity: 0.28; transform: scale(0.82); }
            45% { opacity: 0.98; transform: scale(1.08); }
        }

        @keyframes brandScanTrackMove {
            0%, 100% { transform: translateX(0%); }
            55% { transform: translateX(42%); }
        }

        .brand-scan-badge.brand-b3 {
            width: clamp(176px, 13vw, 240px);
            height: clamp(78px, 6vw, 108px);
            border: none;
            border-radius: 0;
            background: none;
            box-shadow: none;
            backdrop-filter: none;
        }

        .brand-scan-badge.brand-b3::before,
        .brand-scan-badge.brand-b3::after {
            display: none;
        }

        .brand-b3-rail {
            position: absolute;
            left: -8%;
            width: 122%;
            height: 2px;
            transform-origin: 0 50%;
            pointer-events: none;
            overflow: hidden;
        }

        .brand-b3-rail::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(112, 221, 255, 0), rgba(112, 221, 255, 0.26) 18%, rgba(235, 250, 255, 0.9) 50%, rgba(112, 221, 255, 0.26) 82%, rgba(112, 221, 255, 0));
            opacity: 0.36;
            box-shadow:
                0 0 10px rgba(112, 221, 255, 0.14),
                0 0 20px rgba(112, 221, 255, 0.08);
        }

        .brand-b3-rail::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -16%;
            width: 28%;
            height: 6px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(235, 250, 255, 0.95), rgba(112, 221, 255, 0));
            filter: blur(0.2px);
            box-shadow:
                0 0 12px rgba(255, 255, 255, 0.16),
                0 0 18px rgba(112, 221, 255, 0.18);
            animation: brandB3RailSweep 3.4s cubic-bezier(0.38, 0, 0.22, 1) infinite;
        }

        .brand-b3-rail-main {
            top: 48%;
            transform: rotate(-15deg);
        }

        .brand-b3-rail-sub {
            top: 64%;
            opacity: 0.64;
            transform: rotate(-15deg) scaleX(0.82);
        }

        .brand-b3-focus {
            position: absolute;
            left: 34%;
            top: 46%;
            width: 32px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(150, 232, 255, 0.26);
            box-shadow:
                inset 0 0 14px rgba(112, 221, 255, 0.08),
                0 0 20px rgba(112, 221, 255, 0.1);
        }

        .brand-b3-focus::before,
        .brand-b3-focus::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .brand-b3-focus::before {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(240, 251, 255, 0.96) 0 28%, rgba(112, 221, 255, 0.22) 28% 70%, rgba(112, 221, 255, 0) 70%);
            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.16),
                0 0 16px rgba(112, 221, 255, 0.18);
            animation: brandB3FocusPulse 3s ease-in-out infinite;
        }

        .brand-b3-focus::after {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(112, 221, 255, 0.12);
        }

        .brand-b3-brackets,
        .brand-b3-brackets::before,
        .brand-b3-brackets::after {
            position: absolute;
            content: '';
            width: 12px;
            height: 12px;
            border-color: rgba(224, 248, 255, 0.36);
            border-style: solid;
            pointer-events: none;
        }

        .brand-b3-brackets {
            left: calc(34% - 22px);
            top: calc(46% - 22px);
            border-width: 1px 0 0 1px;
        }

        .brand-b3-brackets::before {
            left: 42px;
            top: 0;
            border-width: 1px 1px 0 0;
        }

        .brand-b3-brackets::after {
            left: 0;
            top: 42px;
            border-width: 0 0 1px 1px;
        }

        .brand-b3-brackets span {
            position: absolute;
            left: 42px;
            top: 42px;
            width: 12px;
            height: 12px;
            border-right: 1px solid rgba(224, 248, 255, 0.36);
            border-bottom: 1px solid rgba(224, 248, 255, 0.36);
        }

        .brand-b3-label,
        .brand-b3-readout {
            position: absolute;
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            white-space: nowrap;
            pointer-events: none;
        }

            display: flex;

            height: 94vh;
            position: relative;
        }

        .left-panel { 
            flex: 1.3; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative;
            overflow: visible; /* 允许雷达图辉光溢出 */
        }

        #radarCanvas { 
            width: 100%; 
            max-width: 900px;
            height: auto; 
            aspect-ratio: 1/1;
            /* 1.6 倍放大使得内部逻辑长宽增加 60% 后，能包容哪怕是 20 分这样的越界图像，且最终在屏幕上的视觉大小依然和原先严格一致 */
            transform: translateY(var(--radar-shift-y)) scale(1.6);
            opacity: 1;
            filter: blur(0);
            transition: opacity 0.28s ease, transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), filter 0.45s ease;
        }

        #radarCanvas.radar-hidden {
            opacity: 0;
            filter: blur(18px);
            transform: translateY(var(--radar-shift-y)) scale(1.82);
        }

        #radarCanvas.radar-reveal {
            animation: radarEntrance 0.78s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes radarEntrance {
            0% { opacity: 0; filter: blur(24px); transform: translateY(var(--radar-shift-y)) scale(1.92); }
            60% { opacity: 1; filter: blur(3px); transform: translateY(var(--radar-shift-y)) scale(1.68); }
            100% { opacity: 1; filter: blur(0); transform: translateY(var(--radar-shift-y)) scale(1.6); }
        }

            flex: 0.7; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            gap: 18px;
            padding: 0 10px;
        }

            color: var(--theme-color); 
            text-shadow: 0 0 15px var(--theme-color);
            transition: all 2s ease; /* 名字颜色和发光慢速切换 */
            animation: nameEntrance 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes nameEntrance {
            0% { opacity: 0; transform: translate3d(56px, 0, 0) scale(0.92) skewX(-5deg); filter: blur(12px); }
            68% { opacity: 1; transform: translate3d(-6px, 0, 0) scale(1.015) skewX(1deg); filter: blur(0); }

            border-radius: 12px;
            transition: all 2s ease; /* 边框色变色慢速切换 */
            max-width: 95%; 
            opacity: 0; /* 默认隐藏，由动画控制显示 */
            animation: descEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }

        @keyframes descEntrance {
            0% { opacity: 0; transform: translate3d(52px, 0, 0) scale(0.92); filter: blur(10px); }
            62% { opacity: 1; transform: translate3d(-4px, 0, 0) scale(1.015); filter: blur(0); }
            100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
        }

        .band-desc { 
            font-size: 1.8rem; 
            line-height: 1.3; 
            color: rgba(255, 255, 255, 0.9); 
            transition: all 2s ease;
        }

        .progress-bar-container {
            position: relative;
            align-self: flex-start;
            width: min(100%, 95%);
            height: 3px;
            margin-top: 6px;
            background: rgba(255,255,255,0.05);
        }

        .progress-bar {
            height: 100%;
            background: var(--theme-color);
            box-shadow: 0 0 20px var(--theme-color);
            transition: background 2s ease, box-shadow 2s ease;
            width: 0%;
        }

        /* 底部全局进度条 */
        .global-timeline-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 120;
            cursor: pointer;
        }

        .global-timeline-bar {
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--theme-color));
            width: 0%;
            transition: width 0.1s linear, background 2s ease;
            position: relative;
        }

        .global-timeline-bar::after {
            content: "";
            position: absolute;
            right: 0; top: 50%;
            transform: translateY(-50%);
            width: 4px; height: 100%;
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        .timeline-tooltip {
            position: absolute;
            bottom: 25px;
            color: #fff;
            padding: 5px 10px;
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: 0.9rem;
            pointer-events: none;
            display: none;
            z-index: 101;
            text-align: center;
            text-shadow: 0 0 10px var(--theme-color), 0 0 5px #000;
            white-space: pre; /* 支持换行显示显示乐队名 */
        }

        /* 准备页面 */
        #introOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 1002; /* 必须比粒子 canvas 还要高，才能挡住雷达 */
            transition: opacity 1s ease;
            pointer-events: none;
            opacity: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #introOverlay.lead-in {
            background:
                radial-gradient(circle at 50% 38%, rgba(120, 195, 255, 0.34) 0%, rgba(120, 195, 255, 0) 26%),
                linear-gradient(180deg, #164dbe 0%, #0f3e9f 32%, #0b2d78 72%, #071a45 100%);
            box-shadow: inset 0 0 120px rgba(255,255,255,0.08);
        }

        #introOverlay.lead-in::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 28%),
                radial-gradient(circle at 18% 22%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 18%),
                radial-gradient(circle at 84% 68%, rgba(104, 189, 255, 0.24) 0%, rgba(104, 189, 255, 0) 24%);
            opacity: 0.92;
            animation: introBlueDrift 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        #introOverlay::after {
            content: "按空格开始";
            color: rgba(255, 255, 255, 0.4);
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 1.5rem;
            letter-spacing: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.2; }
            50% { opacity: 0.8; }
            100% { opacity: 0.2; }
        }

        @keyframes introBlueDrift {
            0% { transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
            100% { transform: translate3d(1.5vw, -1vh, 0) scale(1.02); filter: blur(1px); }
        }

        #introOverlay.started::after {
            display: none;
        }

        .intro-sequence {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0;
        }

        #introOverlay.lead-in .intro-sequence {
            opacity: 1;
        }

        .intro-title-banner {

            left: 50%;
            top: 23vh;
            width: min(86vw, 1180px);
            transform: translate3d(-118vw, 0, 0);

            text-align: center;

                transform 0.86s cubic-bezier(0.18, 0.92, 0.24, 1),

        #introOverlay.intro-run .intro-title-banner {

            filter: blur(0);

        #introOverlay.intro-stage-guide .intro-title-banner {

        }

        .intro-title-main {

            letter-spacing: 0.08em;

            text-shadow:

        .intro-title-sub {

            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(15px, 1.08vw, 22px);

        .intro-guide-wrap {

            opacity: 0;
            filter: blur(12px);
            transition:
                transform 0.78s cubic-bezier(0.18, 0.92, 0.24, 1),

        }

        #introOverlay.intro-stage-guide .intro-guide-wrap {
            transform: translate3d(-50%, 0, 0) scale(1);
            opacity: 1;
            filter: blur(0);
        }

        #introOverlay.intro-stage-exit .intro-guide-wrap {
            transform: translate3d(-50%, -12px, 0) scale(1.025);
            opacity: 0;
            filter: blur(14px);
        }

        .intro-guide-head {
            text-align: center;
            margin-bottom: -10px;
        }

        .intro-guide-kicker {
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(12px, 0.96vw, 18px);
            font-weight: 800;
            letter-spacing: 0.34em;
            color: rgba(223, 244, 255, 0.84);
            text-transform: uppercase;
        }

        .intro-guide-title {
            margin-top: 0;
            font-family: "Noto Serif SC", "Microsoft YaHei", serif;
            font-size: clamp(26px, 2.2vw, 46px);
            font-weight: 800;
            color: #f7fbff;
            letter-spacing: 0.08em;
            text-shadow:
                0 0 16px rgba(255,255,255,0.12),
                0 0 26px rgba(112, 205, 255, 0.18);
        }

        .intro-guide-note {
            margin-top: 12px;
            font-family: "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
            font-size: clamp(14px, 1vw, 18px);
            color: rgba(224, 243, 255, 0.76);
            letter-spacing: 0.08em;
        }

        .intro-guide-panel {
            position: relative;
            margin: 0 auto;
            width: min(86vw, 1160px);
            height: min(76vh, 880px);
            overflow: visible;
        }

        .intro-guide-panel::before,
        .intro-guide-panel::after {
            display: none;
        }

        .intro-guide-radar {
            position: absolute;
            left: 50%;
            top: 45.5%;
            width: min(64vw, 74vh, 940px);
            aspect-ratio: 1 / 1;
            transform: translate(-50%, -50%);
        }

        .intro-guide-radar svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .intro-radar-grid-line,
        .intro-radar-axis-line {
            fill: none;
            stroke: rgba(226, 246, 255, 0.16);
        }

        .intro-radar-grid-line.outer {
            stroke: rgba(234, 249, 255, 0.24);
        }

        .intro-radar-axis-line {
            stroke: rgba(220, 244, 255, 0.12);
        }

        .intro-radar-shape-fill {
            fill: rgba(124, 208, 255, 0.18);
            stroke: none;
            animation: introRadarShapePulse 2.4s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .intro-radar-shape-stroke {
            fill: none;
            stroke: rgba(245, 251, 255, 0.96);
            stroke-width: 3.2;
            filter: drop-shadow(0 0 12px rgba(144, 224, 255, 0.24));
        }

        .intro-radar-shape-glow {
            fill: none;
            stroke: rgba(114, 212, 255, 0.42);
            stroke-width: 10;
            filter: blur(14px);
        }

        .intro-guide-labels {
            position: absolute;
            inset: 0;
        }

        .intro-guide-axis {
            position: absolute;
            min-width: 146px;
            max-width: 184px;
            padding: 8px 12px;
            border-radius: 16px;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1px solid rgba(224, 245, 255, 0.1);
            box-shadow: 0 10px 24px rgba(5, 20, 52, 0.14);
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .intro-guide-axis.left { text-align: left; }
        .intro-guide-axis.right { text-align: right; }

        .intro-guide-axis-name {
            display: block;
            font-family: "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
            font-size: clamp(14px, 0.96vw, 18px);
            font-weight: 800;
            color: #f5fbff;
            letter-spacing: 0.08em;
        }

        .intro-guide-axis-max {
            display: block;
            margin-top: 5px;
            font-family: "Orbitron", "HarmonyOS Sans SC", sans-serif;
            font-size: clamp(10px, 0.78vw, 13px);
            font-weight: 700;
            letter-spacing: 0.18em;
            color: rgba(222, 244, 255, 0.78);
            text-transform: uppercase;
        }

        .intro-guide-legend {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(222, 244, 255, 0.1);
            font-family: "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
            font-size: clamp(12px, 0.9vw, 16px);
            color: rgba(232, 246, 255, 0.78);
            letter-spacing: 0.08em;
        }

        .intro-exit-wipe {
            position: absolute;
            top: -18vh;
            left: -56vw;
            width: 52vw;
            height: 136vh;
            opacity: 0;
            background:
                linear-gradient(90deg, rgba(255,255,255,0), rgba(247,252,255,0.26) 24%, rgba(158,225,255,0.82) 56%, rgba(255,255,255,0));
            filter: blur(4px);
            transform: skewX(-18deg) translate3d(-120vw, 0, 0);
            transition:
                transform 0.94s cubic-bezier(0.22, 0.96, 0.2, 1),
                opacity 0.28s ease;
        }

        #introOverlay.intro-stage-exit .intro-exit-wipe {
            opacity: 1;
            transform: skewX(-18deg) translate3d(220vw, 0, 0);
        }

        @keyframes introRadarShapePulse {
            0%, 100% { transform: scale(0.98); opacity: 0.88; }
            50% { transform: scale(1.02); opacity: 1; }
        }

        .session-timer {
            position: fixed;
            bottom: 20px;
            right: 30px;
            font-family: "Orbitron", sans-serif;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
            z-index: 10;
        }

        /* 全屏模式下的 UI 隐藏 */
        :fullscreen body { cursor: none; }
        :fullscreen .global-timeline-container,
        :fullscreen #globalTimeline,
        :fullscreen .progress-bar-container,
        :fullscreen .session-timer { 
            display: none !important; 
        }

        .fade-out { 
            opacity: 0; 
            transform: translate3d(58px, 0, 0) scale(0.92) skewX(-5deg); 
            filter: blur(10px);
            transition: all 0.42s cubic-bezier(0.46, 0.02, 0.78, 0.2);
        }

        /* MVP 乐队底图容器 */
        .mvp-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* 在背景渐变之上，在容器 container 之下 */
            pointer-events: none;
            overflow: hidden;
        }

        .mvp-bg-container::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            background:
                radial-gradient(circle at 16% 24%, rgba(255,231,166,0.2) 0%, rgba(255,231,166,0) 28%),
                radial-gradient(circle at 20% 62%, rgba(255,197,74,0.14) 0%, rgba(255,197,74,0) 34%),
                linear-gradient(90deg, rgba(255,205,92,0.14) 0%, rgba(255,205,92,0.07) 16%, rgba(255,205,92,0) 48%),
                linear-gradient(135deg, rgba(255,245,210,0.1), rgba(0,0,0,0) 58%);
            mix-blend-mode: screen;
            transition: opacity 0.5s ease;
        }

        .mvp-bg-container::after {
            content: 'MVP';
            position: absolute;
            top: 18px;
            left: 26px;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            color: transparent;
            font-family: "Cormorant Garamond", "Noto Serif SC", "Times New Roman", serif;
            font-size: 4.25rem;
            font-style: italic;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 0.12em;
            background:
                linear-gradient(180deg, #ffffff 0%, #fffdf5 8%, #fff6cf 20%, #ffe89f 36%, #ffd661 54%, #ffc126 72%, #d89000 88%, #8b5200 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 2.2px rgba(88, 47, 0, 0.96);
            text-shadow:
                0 1px 0 rgba(255, 255, 255, 0.92),
                0 3px 0 rgba(255, 244, 196, 0.62),
                0 0 10px rgba(255, 248, 209, 0.72),
                0 0 24px rgba(255, 219, 116, 0.48),
                0 0 44px rgba(255, 195, 60, 0.3),
                0 10px 24px rgba(0, 0, 0, 0.38);
            transition: opacity 0.35s ease, transform 0.35s ease;
            transform: translate3d(-14px, -6px, 0) skewX(-12deg) rotate(-7deg) scale(0.92);
        }

        .mvp-bg-container.mvp-active::before {
            opacity: 1;
            animation: mvpGoldAura 3.6s ease-in-out infinite alternate;
        }

        .mvp-bg-container.mvp-active::after {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        .mvp-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: contain; /* 改为 contain，防止裁切 */
            object-position: left center; /* 靠左对齐 */
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.78) 24%, rgba(0,0,0,0.34) 48%, rgba(0,0,0,0.04) 66%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to right, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.78) 24%, rgba(0,0,0,0.34) 48%, rgba(0,0,0,0.04) 66%, rgba(0,0,0,0) 100%);
            transition: transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 2.5s ease;
            transform: translateX(-100%) scale(var(--user-image-scale, 1)); /* 初始在左侧外部 */
            transform-origin: left center;
            opacity: 0;
            filter: saturate(1.02) brightness(0.98);
        }

        .mvp-bg-image.active {
            opacity: 1;
            transform: translateX(0) scale(var(--user-image-scale, 1)); /* 滑动到原位即左侧对齐 */
        }

        .mvp-bg-container.mvp-active .mvp-bg-image.active {
            filter:
                sepia(0.14)
                saturate(1.08)
                brightness(1.02)
                drop-shadow(0 0 10px rgba(248,211,126,0.08))
                drop-shadow(0 0 26px rgba(219,160,42,0.08));
        }

        .mvp-bg-image.exit {
            transform: translateX(0) scale(var(--user-image-scale, 1)); /* 退出时不移动位置 */
            opacity: 0; /* 仅逐渐消失 */
        }

        @keyframes mvpGoldAura {
            0% {
                filter: blur(0px) brightness(1);
                transform: translate3d(0, 0, 0) scale(1);
            }
            50% {
                filter: blur(1px) brightness(1.06);
                transform: translate3d(1.2vw, -1vh, 0) scale(1.015);
            }
            100% {
                filter: blur(0px) brightness(1.02);
                transform: translate3d(-0.8vw, 0.8vh, 0) scale(1.01);
            }
        }

        /* ===== 抽卡出金动画 CSS ===== */
        #gachaOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2000;
            pointer-events: none;
            display: none;
            overflow: hidden;
            --gacha-accent: #ffd76a;

        .gacha-rings,
        .gacha-rays,
        .gacha-shards,
        .gacha-noise,
        .gacha-scanlines {
            position: absolute;
            inset: 0;
            opacity: 0;
        }

            z-index: 2006;
            background:
                radial-gradient(circle at center, rgba(255,255,255,0.95) 0%, rgba(255,240,180,0.75) 16%, rgba(255,255,255,0) 48%),

        .gacha-rings::after {

            z-index: 2004;
            transform-origin: center center;
        }

        .gacha-shards span {

            top: 50%;
            left: 50%;

        .gacha-shards span:nth-child(2) { transform: translate(-50%, -50%) rotate(-12deg) translateY(-34vh); }
        .gacha-shards span:nth-child(3) { transform: translate(-50%, -50%) rotate(12deg) translateY(-32vh); }
        .gacha-shards span:nth-child(4) { transform: translate(-50%, -50%) rotate(34deg) translateY(-29vh); }
        .gacha-shards span:nth-child(5) { transform: translate(-50%, -50%) rotate(145deg) translateY(-30vh); }
        .gacha-shards span:nth-child(6) { transform: translate(-50%, -50%) rotate(168deg) translateY(-24vh); }
        .gacha-shards span:nth-child(7) { transform: translate(-50%, -50%) rotate(198deg) translateY(-33vh); }
        .gacha-shards span:nth-child(8) { transform: translate(-50%, -50%) rotate(222deg) translateY(-27vh); }

        .gacha-noise {
            z-index: 2007;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.08) 0 2px, rgba(0,0,0,0.08) 2px 4px),
                repeating-linear-gradient(90deg, rgba(255,0,85,0.06) 0 3px, rgba(0,255,255,0.06) 3px 6px, transparent 6px 10px);
            mix-blend-mode: screen;
        }

        .gacha-scanlines {

            background: repeating-linear-gradient(180deg, rgba(255,255,255,0.08) 0 1px, rgba(0,0,0,0) 1px 6px);
            mix-blend-mode: screen;
        }

        .gacha-logo-halo,
        .gacha-logo-wings,
        .gacha-logo-sparks,
        .gacha-impact-burst,

    <script>
        let COLOR_PRESETS = [
            { color: "#00ffff", bg1: "#001a1a", bg2: "#000d0d" }, // 青色系
            { color: "#ff00ff", bg1: "#1a001a", bg2: "#0d000d" }, // 洋红色系
            { color: "#ffff00", bg1: "#1a1a00", bg2: "#0d0d00" }, // 黄色系
            { color: "#00ff00", bg1: "#001a00", bg2: "#000d00" }, // 绿色系
            { color: "#ff4500", bg1: "#1a0700", bg2: "#0d0300" }, // 橙红色系
            { color: "#1e90ff", bg1: "#000f1a", bg2: "#00070d" }, // 道奇蓝
            { color: "#ff0040", bg1: "#1a0006", bg2: "#0d0003" }, // 玫红色系
            { color: "#7cfc00", bg1: "#0c1a00", bg2: "#060d00" }, // 草绿色系
            { color: "#ba55d3", bg1: "#13091a", bg2: "#09040d" }, // 中兰花紫
            { color: "#40e0d0", bg1: "#061a18", bg2: "#030d0c" }, // 绿松石系
            { color: "#f08080", bg1: "#1a0e0e", bg2: "#0d0707" }, // 浅珊瑚红
            { color: "#00fa9a", bg1: "#001a10", bg2: "#000d08" }, // 中春绿色
            { color: "#ff8c00", bg1: "#1a0e00", bg2: "#0d0700" }, // 深橙色系
            { color: "#9370db", bg1: "#0f0b1a", bg2: "#07050d" }, // 中紫色系
            { color: "#00ced1", bg1: "#00151a", bg2: "#000a0d" }, // 深青色系
            { color: "#ff1493", bg1: "#1a0210", bg2: "#0d0108" }, // 深粉色系
            { color: "#adff2f", bg1: "#111a03", bg2: "#080d01" }, // 黄绿色系
            { color: "#b0c4de", bg1: "#12141a", bg2: "#090a0d" }, // 亮钢兰
            { color: "#eea2ad", bg1: "#1a1112", bg2: "#0d0809" }, // 浅粉红
            { color: "#00bfff", bg1: "#00131a", bg2: "#00090d" }  // 深天空蓝
        ];

        let colorPool = [...COLOR_PRESETS].sort(() => Math.random() - 0.5);
        let colorIndex = 0;

        // 全局配置参数
        let CONFIG = {
            RADAR_SCALE: 0.9,           // 雷达图底图大小缩放比例
            RADAR_GRID_LEVELS: 5,        // 雷达图底图行数（圈数）
            RADAR_GRID_LINE_WIDTH: 3,    // 雷达图底图线条粗细
            RADAR_GRID_LINE_OPACITY: 0.2, // 雷达图底图线条透明度
            PARTICLE_OPACITY_MULT: 2.0,  // 背景粒子特效透明度倍率
            PARTICLE_SIZE_MULT: 2.0,     // 背景粒子特效大小倍率
            VERTEX_COUNT: 6,             // 雷达图顶点数（默认为6边形，可改为8边形等）,一定要把DIM_NAMES等数组内容也改成对应的个数!
            INTRO_WAIT_TIME: 1000, // 蓝色前奏时长 (ms)
            MUSIC_VOLUME: 0.7, // 背景音乐音量（0-1）
            MUSIC_TRACKS: "music.mp3", // 背景音乐列表，逗号分隔
            OUTRO_VIDEO: "ending.mp4", // 全部角色结束后的结尾视频（主目录文件名）
            OUTRO_TRANSITION_MS: 1100, // 结尾视频转场时长 (ms)

            // 雷达图各个维度的名称
            DIM_NAMES: ["创新性", "旋律", "歌词", "影响力", "主唱", "乐器"],
            // 六个维度的满分基准线，每个维度可单独控制
            BASE_MAX_SCORES: [10, 10, 10, 10, 10, 10], 
            // 六个维度的允许最低分数，每个维度可单独控制
            MIN_SCORES: [5, 5, 5, 5, 5, 5], 

            ANIM_DURATION: 1500, // 雷达各项数值生长动画的过渡时间 (ms)

            // 是否启用特殊的数值格式化（如雷达图的实际值在 11-19 时显示为 "10+"）
            ENABLE_SPECIAL_FORMAT: true, 
            DEFAULT_DURATION: 5000, // 默认每页的的展示时长 (ms)
            SHOW_DESC: true, // 是否显示描述文字(乐评)
            IMAGE_SCALE: 1.0, // 图片默认缩放比例 (1.0 为原始大小)

            // 哪些维度显示为百分数（例如 0.7 变为 70%）。数组长度 6，true 表示显示为百分数，false 表示显示为普通数字
            USE_PERCENTAGE: [false, false, false, false, false, false],
            LABEL_MARGIN: 80, // 维度名称距离雷达图外圈的距离 (px)，默认 80
            USE_AUTO_PRECISION: true, // 是否根据 points 中定义的位数自动控制显示精度（例如写 8.5 就显示 8.5，写 8 就显示整数）
            SHOW_SCORE_UNDER_NAME: false, // 是否将评分数值显示在维度名称下方

            BEST_COLOR: '#FFD700',  // Best标记颜色（金色）
            BEST_LABEL_FONT: 'italic 700 36px "Cormorant Garamond", "Times New Roman", serif', // Best维度标题字体
            BEST_VALUE_FONT: 'italic 700 34px "Cormorant Garamond", "Times New Roman", serif', // Best分数字体
            BEST_FONT: 'italic 700 42px "Cormorant Garamond", "Times New Roman", serif', // Best标记字体

            GACHA_ANIM_DURATION: 4500, // 抽卡出金动画总时长 (ms)
            GACHA_ANIM_TYPE: 2,       // 抽卡动画类型，固定为故障神启
            GACHA_FONT_STYLE: 0,       // 抽卡艺术字风格 (0-3)
            GACHA_LOGO_ON_TIME: 120,   // hsr_logo.webp 出现时间点 (ms)
            GACHA_LOGO_DURATION: 400,  // hsr_logo.webp 停留时长 (ms)
            PHOTO_FX_ENABLED: true,    // 角色图后层粒子开关
            PHOTO_FX_INTENSITY: 1.0,   // 角色图后层粒子强度
            RADAR_AUTO_OFFSET: false,  // 雷达图是否根据形状自动平移中心（会导致“突然上移/下移”）
            PERFORMANCE_MODE: 'balanced', // high / balanced / smooth
            ADAPTIVE_PERF: true,          // 动态降级开关
        };

        function getNextColor() {
            const c = colorPool[colorIndex];
            colorIndex = (colorIndex + 1) % colorPool.length;
            if (colorIndex === 0) colorPool.sort(() => Math.random() - 0.5);
            return c;
        }

        let mvplist = ["castorice"];
        let IMAGE_META = {};

        // ["创新性", "旋律", "歌词", "影响力", "主唱", "乐器"]
        // 可选属性: 
        // colorIndex: 对应 COLOR_PRESETS 索引 (0-19)
        // duration: 该条目持续显示时间 (ms)，默认由 CONFIG.DEFAULT_DURATION 决定
        let namelist = [

{ name: "castorice", points: [15, 15, 10, 20, 10, 10], desc: "无需多言", colorIndex: 12 ,duration: 6000 },
{ name: "Nirvana", points: [9, 8, 9, 12, 9, 7], desc: "xqcl" },
{ name: "Radiohead", points: [13, 8, 9, 10, 8, 12], desc: "rym亲爹。我一直是idm粉丝啊" },
{ name: "Bob Dylan", points: [14, 4, 15, 14, 1, 2], desc: "诺贝尔文学奖得主的含金量，要歌词有歌词，唱功有歌词" },
        ];

        let bands = [];
        let bestScorePerDim = [];
        let totalDuration = 0;
        let timeSegments = [];
        let ANIM_DURATION = 1500;
        const MVP_THEME = {
            color: "#ffd86a",
            bg1: "#2f1d06",
            bg2: "#6d4510"
        };

        function normalizeScore(value) {
            const num = Number(value);
            return Number.isFinite(num) ? num : 0;
        }

        // 维度映射规则：
        // minScore -> 雷达中心(0)
        // maxScore -> 雷达外圈(1)
        // > maxScore 允许继续外扩（>1），< minScore 则压到中心（0）
        function getRadarRatio(value, index) {
            const minScore = Number(CONFIG.MIN_SCORES[index] ?? 0);
            const maxScore = Number(CONFIG.BASE_MAX_SCORES[index] ?? 10);
            const score = normalizeScore(value);
            if (!Number.isFinite(minScore) || !Number.isFinite(maxScore) || maxScore <= minScore) {
                return score >= maxScore ? 1 : 0;
            }
            return Math.max(0, (score - minScore) / (maxScore - minScore));
        }

        function rebuildDerivedData() {
            colorPool = [...COLOR_PRESETS].sort(() => Math.random() - 0.5);
            colorIndex = 0;
            bands = namelist.map(b => {
                const preset = (b.colorIndex !== undefined) ? COLOR_PRESETS[b.colorIndex] : getNextColor();
                const precisions = b.points.map(val => {
                    const s = val.toString();
                    const dotIdx = s.indexOf('.');
                    return dotIdx === -1 ? 0 : s.length - dotIdx - 1;
                });
                return {
                    ...b, 
                    precisions, 
                    isGoat: mvplist.includes(b.name),
                    duration: b.duration || CONFIG.DEFAULT_DURATION,
                    ...preset
                };
            });
            bestScorePerDim = Array.from({ length: CONFIG.VERTEX_COUNT }, (_, i) =>
                Math.max(...bands.map(b => normalizeScore(b.points[i], i)))
            );
            timeSegments = [];
            let accumulatedTime = 0;
            bands.forEach((b, i) => {
                const segmentDuration = getBandTimelineDuration(b, i);
                timeSegments.push({ start: accumulatedTime, end: accumulatedTime + segmentDuration, bandIndex: i });
                accumulatedTime += segmentDuration;
            });
            totalDuration = accumulatedTime;
            ANIM_DURATION = CONFIG.ANIM_DURATION;
        }

        // 尝试从 API 加载数据，失败则使用内置默认值
        async function loadData() {
            try {
                const res = await fetch('/api/data');
                if (res.ok) {
                    const data = await res.json();
                    if (data.CONFIG) Object.assign(CONFIG, data.CONFIG);
                    if (data.COLOR_PRESETS) COLOR_PRESETS = data.COLOR_PRESETS;
                    if (data.mvplist) mvplist = data.mvplist;
                    if (data.IMAGE_META) IMAGE_META = data.IMAGE_META;
                    if (data.namelist) namelist = data.namelist;
                }
            } catch (e) {
                console.log('未连接到服务器，使用内置数据');
            }
            rebuildDerivedData();
            applyMusicPlaylist();
            applyMusicVolume();
        }

        // 首次构建（内置默认值）
        rebuildDerivedData();

        /**
         * 格式化雷达图显示的数值标题
         * @param {number} value - 原始雷达数值
         * @param {number} index - 当前维度的索引（0-5）
         * @returns {string|number} - 将要在图表上显示的文字
         */
        /**
         * 格式化雷达图显示的数值标题
         * @param {number} value - 原始雷达数值
         * @param {number} index - 当前维度的索引（0-5）

         */
        function formatRadarValue(value, index) {
            // 获取当前乐队当前维度预期的精度
            let precision = 0;
            if (currentIndex !== -1 && bands[currentIndex]) {
                precision = bands[currentIndex].precisions[index];
            }

            const normalizedValue = normalizeScore(value);

            // 如果该维度需要显示为百分比
            if (CONFIG.USE_PERCENTAGE && CONFIG.USE_PERCENTAGE[index]) {
                // 百分比按当前维度量程换算：
                // min -> 0%，max -> 100%
                // 例如量程 0~100，填 70 显示 70%
                let pctValue = getRadarRatio(normalizedValue, index) * 100;
                return parseFloat(pctValue.toFixed(precision)).toString() + "%";
            }

            let displayValue = parseFloat(normalizedValue.toFixed(precision)).toString();
            
            // 如果精度要求为0 (整数)，则显式进行四舍五入
            if (precision === 0) {
                let intVal = Math.round(normalizedValue);
                return intVal.toString();
            }

            return displayValue;
        }

        function playlistsEqual(a, b) {

        function getPlaylistCycleDuration(audio = null) {
            const durationsReady = musicTrackDurations.length === musicPlaylist.length
                && musicTrackDurations.every(d => Number.isFinite(d) && d > 0);
            if (durationsReady) {
                return musicTrackDurations.reduce((sum, d) => sum + d, 0);
            }
            const fallbackDuration = Number(audio?.duration);
            if (musicPlaylist.length <= 1 && Number.isFinite(fallbackDuration) && fallbackDuration > 0) {
                return fallbackDuration;
            }
            return 0;
        }

        function ensureMusicTrackDurations() {
            musicTrackDurations = Array(musicPlaylist.length).fill(NaN);
            musicPlaylist.forEach((src, index) => {
                const probe = new Audio();
                probe.preload = "metadata";
                probe.addEventListener("loadedmetadata", () => {
                    const d = Number(probe.duration);
                    if (Number.isFinite(d) && d > 0) musicTrackDurations[index] = d;
                }, { once: true });
                probe.src = src;
            });
        }

        function setMusicTrack(audio, nextIndex, seekTime = 0, autoPlay = false) {
            if (!audio || !musicPlaylist.length) return;
            const len = musicPlaylist.length;
            const index = ((nextIndex % len) + len) % len;
            const src = musicPlaylist[index];
            const prevSrc = audio.dataset.trackSrc || "";
            const switched = prevSrc !== src;
            currentMusicTrackIndex = index;

            const applySeek = () => {
                const dur = Number(audio.duration);
                const t = Number.isFinite(dur) && dur > 0
                    ? Math.max(0, Math.min(seekTime, Math.max(0, dur - 0.05)))
                    : Math.max(0, seekTime);
                try { audio.currentTime = t; } catch (_) {}
                if (autoPlay) audio.play().catch(() => {});
            };

            if (switched) {
                audio.dataset.trackSrc = src;
                audio.src = src;
                audio.addEventListener("loadedmetadata", applySeek, { once: true });
                if (autoPlay) audio.play().catch(() => {});
                return;
            }
            applySeek();
        }

        function bindMusicEndedHandler(audio) {
            if (!audio || musicEndedHandlerBound) return;
            audio.addEventListener("ended", () => {
                const len = Math.max(1, musicPlaylist.length);
                const isLastTrack = currentMusicTrackIndex >= len - 1;
                if (outroActive) {
                    if (!isLastTrack) {
                        setMusicTrack(audio, currentMusicTrackIndex + 1, 0, true);
                    } else {
                        finishOutroSequence();
                    }
                    return;
                }

                const next = (currentMusicTrackIndex + 1) % len;
                if (next === 0) musicPlaybackCycles += 1;
                setMusicTrack(audio, next, 0, true);
            });
            musicEndedHandlerBound = true;
        }

        function revealOutroVideoWhenReady(loadToken, useFallbackOnly = false) {
            if (!outroOverlay || loadToken !== outroVideoLoadToken) return;
            const elapsed = outroStartedAt ? performance.now() - outroStartedAt : 0;
            const waitMs = Math.max(0, getOutroTransitionMs() - elapsed);
            clearOutroRevealTimer();
            outroRevealTimer = setTimeout(() => {
                if (!outroOverlay || loadToken !== outroVideoLoadToken) return;
                if (useFallbackOnly) outroOverlay.classList.add("fallback-only");
                outroOverlay.classList.add("video-ready");
                if (!useFallbackOnly && outroVideo) {
                    outroVideo.play().catch(() => {});

            }, waitMs);
        }

        function tryLoadOutroVideoCandidate(candidates, index, loadToken) {
            if (!outroVideo || loadToken !== outroVideoLoadToken) return;
            if (index >= candidates.length) {
                revealOutroVideoWhenReady(loadToken, true);
                return;
            }

            const src = candidates[index];
            const handleLoaded = () => {
                outroVideo.removeEventListener("loadeddata", handleLoaded);
                outroVideo.removeEventListener("error", handleError);
                if (loadToken !== outroVideoLoadToken) return;
                outroOverlay?.classList.remove("fallback-only");
                revealOutroVideoWhenReady(loadToken, false);
            };
            const handleError = () => {
                outroVideo.removeEventListener("loadeddata", handleLoaded);
                outroVideo.removeEventListener("error", handleError);
                if (loadToken !== outroVideoLoadToken) return;
                tryLoadOutroVideoCandidate(candidates, index + 1, loadToken);
            };

            try { outroVideo.pause(); } catch (_) {}
            outroVideo.muted = true;
            outroVideo.volume = 0;
            outroVideo.loop = false;
            outroVideo.playsInline = true;
            outroVideo.removeEventListener("loadeddata", handleLoaded);
            outroVideo.removeEventListener("error", handleError);
            outroVideo.addEventListener("loadeddata", handleLoaded, { once: true });
            outroVideo.addEventListener("error", handleError, { once: true });
            outroVideo.src = src;
            outroVideo.load();
        }

        function mapContentSecondsToPlaylistPosition(contentSeconds, audio) {
            const seconds = Math.max(0, contentSeconds);
            if (musicPlaylist.length <= 1) {
                const dur = Number(audio?.duration) || 0;
                return { trackIndex: 0, time: dur > 0 ? seconds % dur : seconds };
            }
            const durationsReady = musicTrackDurations.length === musicPlaylist.length
                && musicTrackDurations.every(d => Number.isFinite(d) && d > 0);
            if (!durationsReady) {
                const dur = Number(audio?.duration) || 0;
                return { trackIndex: currentMusicTrackIndex, time: dur > 0 ? seconds % dur : seconds };
            }
            const total = musicTrackDurations.reduce((sum, d) => sum + d, 0);
            let t = total > 0 ? seconds % total : seconds;
            for (let i = 0; i < musicTrackDurations.length; i++) {
                const d = musicTrackDurations[i];
                if (t < d) return { trackIndex: i, time: t };
                t -= d;
            }
            const last = musicTrackDurations.length - 1;
            return { trackIndex: last, time: Math.max(0, musicTrackDurations[last] - 0.05) };
        }
